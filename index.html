<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goodwin Batteries — ERP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#0f2340; --navy2:#16325c; --accent:#f5a623; --accent2:#ffb840;
    --bg:#f3f5f8; --card:#ffffff; --line:#e3e7ee; --text:#1c2733; --muted:#6b7889;
    --green:#1e8e5a; --red:#d64545; --amber:#c98a12;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);}
  #app{display:flex;min-height:100vh;}
  /* Sidebar */
  #sidebar{width:220px;background:linear-gradient(180deg,var(--navy),var(--navy2));color:#fff;flex-shrink:0;display:flex;flex-direction:column;}
  #sidebar .brand{padding:22px 18px 14px;border-bottom:1px solid rgba(255,255,255,.12);}
  #sidebar .brand .name{font-weight:700;font-size:17px;letter-spacing:.3px;}
  #sidebar .brand .tag{font-size:11px;color:var(--accent2);margin-top:2px;}
  #sidebar nav{flex:1;overflow-y:auto;padding:10px 0;}
  #sidebar nav .navitem{display:flex;align-items:center;gap:10px;padding:10px 18px;font-size:13.5px;cursor:pointer;color:#cfd9e8;border-left:3px solid transparent;}
  #sidebar nav .navitem:hover{background:rgba(255,255,255,.06);color:#fff;}
  #sidebar nav .navitem.active{background:rgba(255,255,255,.10);color:#fff;border-left-color:var(--accent);font-weight:600;}
  #sidebar .foot{padding:12px 18px;font-size:11px;color:#93a2b8;border-top:1px solid rgba(255,255,255,.12);}
  #sidebar select#roleSelect{width:100%;margin-top:6px;padding:4px;border-radius:6px;border:none;font-size:12px;}
  /* Main */
  #main{flex:1;min-width:0;display:flex;flex-direction:column;}
  header.topbar{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;}
  header.topbar h1{font-size:19px;margin:0;color:var(--navy);}
  header.topbar .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  #content{padding:22px 24px 60px;overflow-y:auto;}
  /* Cards / grid */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
  .kpi .label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .kpi .value{font-size:22px;font-weight:700;color:var(--navy);margin-top:6px;}
  .kpi .value.red{color:var(--red);} .kpi .value.green{color:var(--green);} .kpi .value.amber{color:var(--amber);}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:18px;}
  .panel h2{font-size:15px;margin:0 0 12px;color:var(--navy);}
  .row{display:flex;gap:16px;flex-wrap:wrap;}
  .row > .panel{flex:1;min-width:320px;}
  /* Table */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;background:#f7f9fc;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;}
  td{padding:9px 10px;border-bottom:1px solid #eef1f6;vertical-align:top;}
  tr:hover td{background:#fafcff;}
  .tbl-wrap{overflow-x:auto;}
  /* Buttons */
  button, .btn{font-family:inherit;border:none;border-radius:7px;padding:8px 14px;font-size:13px;cursor:pointer;font-weight:600;transition:.15s;}
  .btn-primary{background:var(--navy);color:#fff;} .btn-primary:hover{background:var(--navy2);}
  .btn-accent{background:var(--accent);color:#1c2733;} .btn-accent:hover{background:var(--accent2);}
  .btn-ghost{background:#eef1f6;color:var(--text);} .btn-ghost:hover{background:#e2e7ee;}
  .btn-danger{background:#fdecec;color:var(--red);} .btn-danger:hover{background:#fbd9d9;}
  .btn-sm{padding:5px 9px;font-size:12px;border-radius:6px;}
  button:disabled{opacity:.45;cursor:not-allowed;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;justify-content:space-between;}
  .toolbar .left{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  input,select,textarea{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--text);}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent);}
  label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:4px;}
  .field{margin-bottom:12px;}
  .field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;}
  /* Badges */
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.2px;}
  .badge-green{background:#e5f5ec;color:var(--green);} .badge-red{background:#fdecec;color:var(--red);}
  .badge-amber{background:#fdf3e0;color:var(--amber);} .badge-gray{background:#eef1f6;color:var(--muted);}
  .badge-navy{background:#e7ecf5;color:var(--navy);}
  /* Modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(15,35,64,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:100;}
  .modal{background:#fff;border-radius:12px;max-width:760px;width:100%;padding:22px 24px;margin-bottom:40px;}
  .modal h3{margin:0 0 16px;color:var(--navy);font-size:17px;}
  .modal .close-x{float:right;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);}
  /* Line items table in forms */
  .li-table input, .li-table select{width:100%;padding:6px 7px;font-size:12.5px;}
  .li-table td{padding:5px 4px;}
  .li-table th{padding:6px 4px;font-size:10.5px;}
  /* Toast */
  #toastWrap{position:fixed;bottom:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--navy);color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.2);animation:slidein .2s ease;}
  .toast.error{background:var(--red);}
  .toast.success{background:var(--green);}
  @keyframes slidein{from{transform:translateY(10px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
  .empty-state .big{font-size:32px;margin-bottom:8px;}
  .muted{color:var(--muted);}
  .right{text-align:right;}
  .center{text-align:center;}
  .mono{font-family:'Consolas',monospace;}
  .tag-select{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .tag-select button{background:#eef1f6;color:var(--text);}
  .tag-select button.active{background:var(--navy);color:#fff;}
  .footer-note{font-size:11px;color:var(--muted);margin-top:6px;}
  a.link{color:var(--navy2);cursor:pointer;text-decoration:underline;}
  @media print{
    #sidebar, header.topbar, .toolbar, .no-print{display:none !important;}
    #content{padding:0;}
    body{background:#fff;}
  }
  @media (max-width:780px){
    #sidebar{position:fixed;left:-220px;top:0;bottom:0;z-index:200;transition:.2s;}
    #sidebar.open{left:0;}
    #main{width:100%;}
    .row > .panel{min-width:100%;}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="name">⚡ GOODWIN BATTERIES</div>
      <div class="tag">Business ERP</div>
      <select id="roleSelect"></select>
    </div>
    <nav id="navList"></nav>
    <div class="foot">
      Data mode: <b id="storageModeLabel">—</b>
      <div class="footer-note" id="dataModeNote"></div>
    </div>
  </aside>
  <div id="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="sub" id="pageSub">Overview of your business</div>
      </div>
      <div>
        <button class="btn-ghost btn-sm" onclick="app.exportBackup()">⇩ Backup JSON</button>
      </div>
    </header>
    <div id="content"></div>
  </div>
</div>
<div id="modalRoot"></div>
<div id="toastWrap"></div>

<script>
/* =========================================================================
   GOODWIN BATTERIES ERP
   Single-file application. Persists via Supabase.
   ========================================================================= */

// SETUP INSTRUCTIONS:
// 1. Create a project in Supabase (https://supabase.com)
// 2. Go to SQL Editor in Supabase and run:
//    CREATE TABLE store ( key TEXT PRIMARY KEY, value JSONB );
// 3. Replace the URL and KEY below with your Supabase project's API URL and anon key.
const SUPABASE_URL = localStorage.getItem('gw:supabase_url') || 'YOUR_SUPABASE_URL';
const SUPABASE_KEY = localStorage.getItem('gw:supabase_key') || 'YOUR_SUPABASE_KEY';

// Initialize Supabase client
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ----------------------------- STORAGE LAYER ---------------------------- */
const Store = (() => {
  let memory = {}; // in-memory fallback
  const isConfigured = () => SUPABASE_URL !== 'YOUR_SUPABASE_URL' && SUPABASE_KEY !== 'YOUR_SUPABASE_KEY';

  async function get(key) {
    if (isConfigured()) {
      try {
        const { data, error } = await supabase.from('store').select('value').eq('key', key).single();
        if (error) {
          if (error.code === 'PGRST116') return null; // No rows found
          throw error;
        }
        return data ? data.value : null;
      } catch (e) {
        console.error('Supabase GET failed', key, e);
        return memory[key] !== undefined ? JSON.parse(JSON.stringify(memory[key])) : null;
      }
    }
    return memory[key] !== undefined ? JSON.parse(JSON.stringify(memory[key])) : null;
  }
  
  async function set(key, value) {
    if (isConfigured()) {
      try {
        const { error } = await supabase.from('store').upsert({ key: key, value: value });
        if (error) throw error;
        return true;
      } catch (e) {
        console.error('Supabase SET failed', key, e);
        return false;
      }
    }
    memory[key] = JSON.parse(JSON.stringify(value));
    return true;
  }
  
  return { get, set, usingRealStorage: isConfigured };
})();

/* ------------------------------- DATA MODEL ------------------------------
   Collections (each an array persisted under its own key):
   customers, suppliers, products, salesInvoices, purchaseInvoices,
   receipts, payments, salesReturns, purchaseReturns, stockTx, warranties,
   auditLog, counters, settings
   ---------------------------------------------------------------------- */

const COLLECTIONS = ['customers','suppliers','products','salesInvoices','purchaseInvoices',
  'receipts','payments','salesReturns','purchaseReturns','stockTx','warranties','auditLog'];

let DB = {}; // in-memory working copy of all collections, loaded at boot
let COUNTERS = {};
let SETTINGS = {};
let CURRENT_ROLE = 'Admin';

function uid(prefix) { return prefix + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }
function todayISO() { return new Date().toISOString().slice(0,10); }
function nowISO() { return new Date().toISOString(); }
function inr(n) {
  n = Number(n) || 0;
  const neg = n < 0; n = Math.abs(n);
  let s = n.toFixed(2);
  let [int, dec] = s.split('.');
  let last3 = int.slice(-3), rest = int.slice(0, -3);
  if (rest !== '') last3 = ',' + last3;
  let formatted = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + last3;
  return (neg?'-':'') + '₹' + formatted + '.' + dec;
}
function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function esc(s){ return String(s===undefined||s===null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function nextNumber(seriesKey, prefix) {
  const year = new Date().getFullYear();
  const ck = `${seriesKey}-${year}`;
  COUNTERS[ck] = (COUNTERS[ck] || 0) + 1;
  const n = String(COUNTERS[ck]).padStart(4, '0');
  return `${prefix}-${year}-${n}`;
}

function logAudit(action, entity, entityId, summary, before, after) {
  DB.auditLog.unshift({
    id: uid('AL'), ts: nowISO(), user: CURRENT_ROLE, action, entity, entityId, summary,
    before: before || null, after: after || null
  });
  if (DB.auditLog.length > 500) DB.auditLog.length = 500;
}

/* ------------------------------ PERSISTENCE ------------------------------ */
async function loadAll() {
  for (const c of COLLECTIONS) {
    const v = await Store.get('gw:' + c);
    DB[c] = v || [];
  }
  COUNTERS = (await Store.get('gw:counters')) || {};
  SETTINGS = (await Store.get('gw:settings')) || defaultSettings();
  if (!DB.customers.length && !DB.products.length && !(await Store.get('gw:seeded'))) {
    seedDemoData();
    await persistAll();
    await Store.set('gw:seeded', true);
  }
}
async function persist(collection) {
  await Store.set('gw:' + collection, DB[collection]);
}
async function persistAll() {
  for (const c of COLLECTIONS) await persist(c);
  await Store.set('gw:counters', COUNTERS);
  await Store.set('gw:settings', SETTINGS);
}
async function persistCounters(){ await Store.set('gw:counters', COUNTERS); }
async function persistSettings(){ await Store.set('gw:settings', SETTINGS); }

function defaultSettings() {
  return {
    companyName: 'Goodwin Batteries Pvt. Ltd.',
    companyState: 'Maharashtra',
    companyGSTIN: '27ABCDE1234F1Z5',
    companyAddress: 'Plot 14, MIDC Industrial Area, Pune, Maharashtra 411019',
    companyPhone: '+91 98765 43210',
    companyEmail: 'accounts@goodwinbatteries.example',
    bankDetails: 'HDFC Bank, A/c 5020XXXXXXXX, IFSC HDFC0001234',
    defaultGSTRate: 18,
    defaultCreditDays: 30,
    creditPolicy: 'warn', // warn | confirm | block
    terms: 'Goods once sold will not be taken back except under warranty terms. Interest @18% p.a. charged on overdue payments. Subject to Pune jurisdiction.'
  };
}

/* ------------------------------ SEED DATA -------------------------------- */
function seedDemoData() {
  const states = ['Maharashtra','Maharashtra','Gujarat','Karnataka','Maharashtra','Delhi'];
  const custNames = [
    ['ABC Battery Dealer','Rakesh Shah','Pune, Maharashtra','Maharashtra',500000],
    ['Sunrise Auto Traders','Meena Kulkarni','Nashik, Maharashtra','Maharashtra',300000],
    ['Patel Power Solutions','Jignesh Patel','Ahmedabad, Gujarat','Gujarat',400000],
    ['Karnataka Battery Hub','Suresh Rao','Bengaluru, Karnataka','Karnataka',250000],
    ['Metro Distributors','Anil Deshmukh','Mumbai, Maharashtra','Maharashtra',600000],
    ['Capital OEM Supplies','Vikram Sethi','New Delhi, Delhi','Delhi',350000],
  ];
  custNames.forEach(([name,contact,addr,state,limit],i) => {
    DB.customers.push({
      id: uid('CUS'), name, company: name, contact, mobile: '98'+String(100000000+i*11111).slice(0,8),
      email: name.toLowerCase().replace(/[^a-z]/g,'') + '@example.com', address: addr, city: addr.split(',')[0],
      state, pin: '400001', gstin: state==='Maharashtra' ? '27AAAAA0000A1Z'+i : (state==='Gujarat'?'24AAAAA0000A1Z'+i: state==='Karnataka'?'29AAAAA0000A1Z'+i:'07AAAAA0000A1Z'+i),
      pan: 'AAAAA0000A', customerType: i%2===0?'Dealer':'Distributor', creditLimit: limit,
      creditDays: 30, openingBalance: 0, createdAt: nowISO(), status: 'active'
    });
  });
  const suppliers = [
    ['Exide Industries Ltd','Supply Desk','Kolkata, West Bengal','West Bengal','19AAAAA0000A1Z1'],
    ['Amara Raja Batteries','Supply Desk','Tirupati, Andhra Pradesh','Andhra Pradesh','37AAAAA0000A1Z2'],
    ['Luminous Power Technologies','Supply Desk','Noida, Uttar Pradesh','Uttar Pradesh','09AAAAA0000A1Z3'],
  ];
  suppliers.forEach(([name,contact,addr,state,gstin]) => {
    DB.suppliers.push({
      id: uid('SUP'), name, company: name, contact, mobile:'99887766'+String(Math.floor(Math.random()*90+10)),
      email: name.toLowerCase().replace(/[^a-z]/g,'')+'@example.com', address: addr, state, gstin,
      creditDays: 45, creditLimit: 1000000, openingBalance: 0, createdAt: nowISO()
    });
  });
  const products = [
    ['GW-N150','Goodwin','Endura N150','Automotive','12V','150Ah','Flooded (Lead-Acid)',18,'8507',9500,12500,13500,42,10,'Main Warehouse'],
    ['GW-N100','Goodwin','Endura N100','Automotive','12V','100Ah','Flooded (Lead-Acid)',18,'8507',6800,8900,9600,60,15,'Main Warehouse'],
    ['GW-IT550','Goodwin','InverTuff 550','Inverter','12V','150Ah','Tubular',18,'8507',10200,13200,14200,25,8,'Main Warehouse'],
    ['GW-SMF35','Goodwin','SealTech SMF35','Two-Wheeler','12V','35Ah','SMF (Sealed)',18,'8507',2300,3100,3400,80,20,'Pune Depot'],
    ['GW-E200','Goodwin','EcoRide E200','E-Rickshaw','12V','200Ah','Tubular',18,'8507',11500,14800,15900,18,6,'Pune Depot'],
    ['GW-UPS42','Goodwin','GuardCell UPS42','UPS','12V','42Ah','VRLA',18,'8507',3400,4500,4900,50,12,'Main Warehouse'],
  ];
  products.forEach(([sku,brand,model,cat,volt,ah,type,gst,hsn,pp,sp,mrp,open,min,wh]) => {
    DB.products.push({
      id: uid('PRD'), name: model, brand, model, sku, category: cat, voltage: volt, ah, batteryType: type,
      gstRate: gst, hsn, purchasePrice: pp, sellingPrice: sp, mrp, openingStock: open, minStock: min,
      warehouse: wh, warrantyMonths: cat==='Automotive'?18:cat==='Inverter'?30:cat==='E-Rickshaw'?12:24,
      createdAt: nowISO(), status: 'active'
    });
  });
  // Opening-stock transactions for each seeded product (single source of truth for stock).
  DB.stockTx = [];
  DB.products.forEach(p => {
    DB.stockTx.push({ id: uid('STX'), date: todayISO(), productId: p.id, type: 'Opening Stock',
      qty: p.openingStock, before: 0, after: p.openingStock, refType: 'Opening', refId: '-', user: 'System' });
  });

  // A couple of demo transactions so the dashboard isn't empty
  const cust = DB.customers[0];
  const prod = DB.products[0];
  const inv = createSalesInvoiceObj({
    customerId: cust.id, date: todayISO(), dueDate: addDays(todayISO(), cust.creditDays),
    paymentMode: 'Credit', status: 'Confirmed',
    lines: [{ productId: prod.id, qty: 40, rate: prod.sellingPrice, discountPct: 2 }],
    freight: 1200
  });
  DB.salesInvoices.push(inv);
  applyStockForSale(inv);
  const rec = {
    id: uid('RCT'), number: nextNumber('RCT','GW-RCT'), date: todayISO(), customerId: cust.id,
    amount: 300000, mode: 'Bank', reference: 'NEFT/DEMO/001', allocations: [{ invoiceId: inv.id, amount: 300000 }],
    createdAt: nowISO()
  };
  DB.receipts.push(rec);
}
function addDays(iso, days) { const d = new Date(iso); d.setDate(d.getDate()+ (days||0)); return d.toISOString().slice(0,10); }

/* ============================ ACCOUNTING ENGINE ==========================
   Single authoritative source for outstanding / stock. Every figure shown
   anywhere in the UI (dashboard, ledgers, customer profile, reports) is
   derived from these functions — never stored/duplicated separately.
   ========================================================================= */

// ---- GST calculation ----
function calcLine(qty, rate, discountPct, gstRate, sameState) {
  qty = num(qty); rate = num(rate); discountPct = num(discountPct); gstRate = num(gstRate);
  const gross = qty * rate;
  const discount = gross * discountPct / 100;
  const taxable = gross - discount;
  let cgst = 0, sgst = 0, igst = 0;
  if (sameState) { cgst = taxable * gstRate / 200; sgst = taxable * gstRate / 200; }
  else { igst = taxable * gstRate / 100; }
  const total = taxable + cgst + sgst + igst;
  return { gross, discount, taxable, cgst, sgst, igst, total };
}
function invoiceTotals(lines, freight, sameState) {
  let taxable=0, cgst=0, sgst=0, igst=0;
  const computed = lines.map(l => {
    const c = calcLine(l.qty, l.rate, l.discountPct, l.gstRate, sameState);
    taxable += c.taxable; cgst += c.cgst; sgst += c.sgst; igst += c.igst;
    return { ...l, ...c };
  });
  const grandTotal = taxable + cgst + sgst + igst + num(freight);
  return { lines: computed, taxable, cgst, sgst, igst, freight: num(freight), grandTotal };
}

// ---- Sales invoice outstanding (no double counting) ----
function invoiceAllocatedAmount(invoiceId) {
  let sum = 0;
  DB.receipts.forEach(r => (r.allocations||[]).forEach(a => { if (a.invoiceId === invoiceId) sum += num(a.amount); }));
  return sum;
}
function invoiceCreditNoteAmount(invoiceId) {
  let sum = 0;
  DB.salesReturns.forEach(sr => { if (sr.invoiceId === invoiceId && sr.status !== 'Cancelled') sum += num(sr.creditNoteAmount); });
  return sum;
}
function invoiceOutstanding(inv) {
  if (inv.status === 'Cancelled' || inv.status === 'Draft') return 0;
  const allocated = invoiceAllocatedAmount(inv.id);
  const cn = invoiceCreditNoteAmount(inv.id);
  return round2(inv.grandTotal - allocated - cn);
}
function round2(n){ return Math.round((num(n)+Number.EPSILON)*100)/100; }

function customerUnallocatedCredit(customerId) {
  // on-account portion of receipts not yet allocated to any invoice
  let sum = 0;
  DB.receipts.filter(r => r.customerId === customerId).forEach(r => {
    const allocated = (r.allocations||[]).reduce((s,a)=>s+num(a.amount),0);
    sum += Math.max(0, num(r.amount) - allocated);
  });
  return round2(sum);
}
function customerOutstanding(customerId) {
  const invs = DB.salesInvoices.filter(i => i.customerId === customerId && i.status !== 'Cancelled' && i.status !== 'Draft');
  const total = invs.reduce((s,i)=> s + invoiceOutstanding(i), 0);
  return round2(total - customerUnallocatedCredit(customerId));
}
function customerOverdue(customerId) {
  const today = todayISO();
  const invs = DB.salesInvoices.filter(i => i.customerId === customerId && i.status !== 'Cancelled' && i.status !== 'Draft' && i.dueDate < today);
  return round2(invs.reduce((s,i)=> s + invoiceOutstanding(i), 0));
}
function customerTotalSales(customerId) {
  return round2(DB.salesInvoices.filter(i=>i.customerId===customerId && i.status!=='Cancelled' && i.status!=='Draft').reduce((s,i)=>s+i.grandTotal,0));
}
function customerTotalCollected(customerId) {
  return round2(DB.receipts.filter(r=>r.customerId===customerId).reduce((s,r)=>s+num(r.amount),0));
}
function creditStatus(customer) {
  const outstanding = customerOutstanding(customer.id);
  const limit = num(customer.creditLimit);
  if (limit <= 0) return 'Normal';
  const pct = outstanding / limit;
  if (outstanding > limit) return 'Limit Exceeded';
  if (pct >= 0.85) return 'Near Limit';
  return 'Normal';
}

// ---- Purchase / supplier outstanding ----
function purchaseAllocatedAmount(purchaseId) {
  let sum = 0;
  DB.payments.forEach(p => (p.allocations||[]).forEach(a => { if (a.purchaseId === purchaseId) sum += num(a.amount); }));
  return sum;
}
function purchaseDebitNoteAmount(purchaseId) {
  let sum = 0;
  DB.purchaseReturns.forEach(pr => { if (pr.purchaseId === purchaseId && pr.status !== 'Cancelled') sum += num(pr.debitNoteAmount); });
  return sum;
}
function purchaseOutstanding(p) {
  if (p.status === 'Cancelled' || p.status === 'Draft') return 0;
  return round2(p.grandTotal - purchaseAllocatedAmount(p.id) - purchaseDebitNoteAmount(p.id));
}
function supplierUnallocatedCredit(supplierId) {
  let sum = 0;
  DB.payments.filter(p => p.supplierId === supplierId).forEach(p => {
    const allocated = (p.allocations||[]).reduce((s,a)=>s+num(a.amount),0);
    sum += Math.max(0, num(p.amount) - allocated);
  });
  return round2(sum);
}
function supplierOutstanding(supplierId) {
  const purs = DB.purchaseInvoices.filter(p => p.supplierId === supplierId && p.status !== 'Cancelled' && p.status !== 'Draft');
  const total = purs.reduce((s,p)=> s + purchaseOutstanding(p), 0);
  return round2(total - supplierUnallocatedCredit(supplierId));
}
function supplierTotalPurchases(supplierId) {
  return round2(DB.purchaseInvoices.filter(p=>p.supplierId===supplierId && p.status!=='Cancelled' && p.status!=='Draft').reduce((s,p)=>s+p.grandTotal,0));
}
function supplierTotalPaid(supplierId) {
  return round2(DB.payments.filter(p=>p.supplierId===supplierId).reduce((s,p)=>s+num(p.amount),0));
}

// ---- Stock (single source of truth: sum of signed ledger deltas) ----
// Opening stock is itself recorded as the first positive delta, so this one
// function is the only place "current stock" is ever computed.
function stock(productId) {
  return round2(DB.stockTx.filter(t => t.productId === productId).reduce((s,t)=> s + num(t.qty), 0));
}
function recordStockTx(productId, delta, type, refType, refId, note) {
  const before = stock(productId);
  const after = round2(before + delta);
  DB.stockTx.push({
    id: uid('STX'), date: todayISO(), productId, type, qty: delta, before, after,
    refType, refId, note: note||'', user: CURRENT_ROLE
  });
  return after;
}
function stockValue() {
  return round2(DB.products.reduce((s,p)=> s + stock(p.id) * num(p.purchasePrice), 0));
}

/* ------------------------------ SALES LOGIC ------------------------------ */
function createSalesInvoiceObj({customerId, date, dueDate, paymentMode, status, lines, freight, notes}) {
  const cust = DB.customers.find(c=>c.id===customerId);
  const sameState = cust && cust.state === SETTINGS.companyState;
  const enriched = lines.map(l => {
    const p = DB.products.find(pp=>pp.id===l.productId);
    return { productId: l.productId, sku: p.sku, name: p.name, hsn: p.hsn, qty: num(l.qty), rate: num(l.rate),
      discountPct: num(l.discountPct||0), gstRate: p.gstRate };
  });
  const totals = invoiceTotals(enriched, freight||0, sameState);
  return {
    id: uid('INV'), number: nextNumber('SALES','GW-INV'), date, dueDate, customerId, paymentMode: paymentMode || 'Credit',
    status: status || 'Confirmed', sameState, lines: totals.lines, taxable: round2(totals.taxable),
    cgst: round2(totals.cgst), sgst: round2(totals.sgst), igst: round2(totals.igst), freight: round2(totals.freight),
    grandTotal: round2(totals.grandTotal), notes: notes || '', createdAt: nowISO(), createdBy: CURRENT_ROLE
  };
}
function applyStockForSale(inv) {
  inv.lines.forEach(l => recordStockTx(l.productId, -Math.abs(l.qty), 'Sale', 'Sale', inv.id, inv.number));
}
function reverseStockForSale(inv) {
  inv.lines.forEach(l => recordStockTx(l.productId, Math.abs(l.qty), 'Stock Adjustment', 'Sale Cancelled', inv.id, 'Reversal of ' + inv.number));
}

function createPurchaseObj({supplierId, date, lines, freight, status, notes}) {
  const sup = DB.suppliers.find(s=>s.id===supplierId);
  const sameState = sup && sup.state === SETTINGS.companyState;
  const enriched = lines.map(l => {
    const p = DB.products.find(pp=>pp.id===l.productId);
    return { productId: l.productId, sku: p.sku, name: p.name, hsn: p.hsn, qty: num(l.qty), rate: num(l.rate),
      discountPct: num(l.discountPct||0), gstRate: p.gstRate };
  });
  const totals = invoiceTotals(enriched, freight||0, sameState);
  return {
    id: uid('PUR'), number: nextNumber('PUR','GW-PUR'), date, supplierId, status: status||'Confirmed', sameState,
    lines: totals.lines, taxable: round2(totals.taxable), cgst: round2(totals.cgst), sgst: round2(totals.sgst),
    igst: round2(totals.igst), freight: round2(totals.freight), grandTotal: round2(totals.grandTotal),
    notes: notes||'', createdAt: nowISO(), createdBy: CURRENT_ROLE
  };
}
function applyStockForPurchase(p) {
  p.lines.forEach(l => recordStockTx(l.productId, Math.abs(l.qty), 'Purchase', 'Purchase', p.id, p.number));
  // update product's purchase price to latest cost (simple moving cost = last cost)
  p.lines.forEach(l => { const prod = DB.products.find(x=>x.id===l.productId); if (prod) prod.purchasePrice = l.rate; });
}

function toast(msg, type) {

}

function renderDashboard(el) {
  const today = todayISO();
  const salesToday = DB.salesInvoices.filter(i=>i.date===today && i.status!=='Cancelled' && i.status!=='Draft').reduce((s,i)=>s+i.grandTotal,0);
  const collToday = DB.receipts.filter(r=>r.date===today).reduce((s,r)=>s+num(r.amount),0);
  const purToday = DB.purchaseInvoices.filter(p=>p.date===today && p.status!=='Cancelled').reduce((s,p)=>s+p.grandTotal,0);
  const monthPrefix = today.slice(0,7);
  const monthSales = DB.salesInvoices.filter(i=>i.date.startsWith(monthPrefix) && i.status!=='Cancelled' && i.status!=='Draft').reduce((s,i)=>s+i.grandTotal,0);
  const monthPurchases = DB.purchaseInvoices.filter(p=>p.date.startsWith(monthPrefix) && p.status!=='Cancelled').reduce((s,p)=>s+p.grandTotal,0);

  // COGS for month-sold lines (based on product's current purchase price as proxy cost)
  let cogs = 0, monthRevenue = 0;
  DB.salesInvoices.filter(i=>i.date.startsWith(monthPrefix) && i.status!=='Cancelled' && i.status!=='Draft').forEach(inv => {
    inv.lines.forEach(l => {
      const p = DB.products.find(pp=>pp.id===l.productId);
      cogs += (p ? num(p.purchasePrice) : 0) * l.qty;
    });
    monthRevenue += inv.taxable; // revenue excl. GST
  });
  const grossProfit = round2(monthRevenue - cogs);

  const totalReceivable = DB.customers.reduce((s,c)=> s + customerOutstanding(c.id), 0);
  const totalPayable = DB.suppliers.reduce((s,s2)=> s + supplierOutstanding(s2.id), 0);
  const invValue = stockValue();
  const cash = DB.receipts.filter(r=>r.mode==='Cash').reduce((s,r)=>s+num(r.amount),0) - DB.payments.filter(p=>p.mode==='Cash').reduce((s,p)=>s+num(p.amount),0);
  const bank = DB.receipts.filter(r=>r.mode==='Bank').reduce((s,r)=>s+num(r.amount),0) - DB.payments.filter(p=>p.mode==='Bank').reduce((s,p)=>s+num(p.amount),0);
  const upi = DB.receipts.filter(r=>r.mode==='UPI').reduce((s,r)=>s+num(r.amount),0) - DB.payments.filter(p=>p.mode==='UPI').reduce((s,p)=>s+num(p.amount),0);
  const totalFunds = round2(cash+bank+upi);
  const overdueTotal = DB.customers.reduce((s,c)=>s+customerOverdue(c.id),0);

  const kpis = [
    ["Today's Sales", inr(salesToday), ''],
    ["Today's Collection", inr(collToday), 'green'],
    ["Today's Purchases", inr(purToday), ''],
    ["Month Sales", inr(monthSales), ''],
    ["Month Purchases", inr(monthPurchases), ''],
    ["Month Gross Profit", inr(grossProfit), grossProfit>=0?'green':'red'],
    ["Outstanding Receivable", inr(totalReceivable), 'amber'],
    ["Outstanding Payable", inr(totalPayable), 'amber'],
    ["Overdue Receivable", inr(overdueTotal), overdueTotal>0?'red':'green'],
    ["Inventory Value", inr(invValue), ''],
    ["Cash Balance", inr(cash), ''],
    ["Bank Balance", inr(bank), ''],
    ["UPI Balance", inr(upi), ''],
    ["Total Available Funds", inr(totalFunds), 'green'],
  ];

  const dealerSales = {};
  DB.salesInvoices.filter(i=>i.status!=='Cancelled'&&i.status!=='Draft').forEach(i=>{ dealerSales[i.customerId]=(dealerSales[i.customerId]||0)+i.grandTotal; });
  const topCustomers = Object.entries(dealerSales).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id,amt])=>({name:(DB.customers.find(c=>c.id===id)||{}).name||'—', amt}));

  const productSales = {};
  DB.salesInvoices.filter(i=>i.status!=='Cancelled'&&i.status!=='Draft').forEach(i=> i.lines.forEach(l=>{ productSales[l.productId]=(productSales[l.productId]||0)+l.qty; }));
  const topProducts = Object.entries(productSales).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id,qty])=>({name:(DB.products.find(p=>p.id===id)||{}).name||'—', qty}));

  const stateSales = {};
  DB.salesInvoices.filter(i=>i.status!=='Cancelled'&&i.status!=='Draft').forEach(i=>{ const c=DB.customers.find(x=>x.id===i.customerId); const st=c?c.state:'Unknown'; stateSales[st]=(stateSales[st]||0)+i.grandTotal; });

  const lowStock = DB.products.filter(p => stock(p.id) <= num(p.minStock));

  el.innerHTML = `
    <div class="kpi-grid">${kpis.map(([l,v,cls])=>`<div class="kpi"><div class="label">${l}</div><div class="value ${cls}">${v}</div></div>`).join('')}</div>
    <div class="row">
      <div class="panel">
        <h2>Top 5 Customers (by sales)</h2>
        ${topCustomers.length? `<table><tr><th>Customer</th><th class="right">Sales</th></tr>${topCustomers.map(c=>`<tr><td>${esc(c.name)}</td><td class="right">${inr(c.amt)}</td></tr>`).join('')}</table>` : `<div class="empty-state">No sales yet</div>`}
      </div>
      <div class="panel">
        <h2>Top 5 Products (by qty sold)</h2>
        ${topProducts.length? `<table><tr><th>Product</th><th class="right">Qty</th></tr>${topProducts.map(p=>`<tr><td>${esc(p.name)}</td><td class="right">${p.qty}</td></tr>`).join('')}</table>` : `<div class="empty-state">No sales yet</div>`}
      </div>
    </div>
    <div class="row">
      <div class="panel">
        <h2>State-wise Sales</h2>
        ${Object.keys(stateSales).length? `<table><tr><th>State</th><th class="right">Sales</th></tr>${Object.entries(stateSales).sort((a,b)=>b[1]-a[1]).map(([s,a])=>`<tr><td>${esc(s)}</td><td class="right">${inr(a)}</td></tr>`).join('')}</table>` : `<div class="empty-state">No sales yet</div>`}
      </div>
      <div class="panel">
        <h2>Low Stock Alerts</h2>
        ${lowStock.length? `<table><tr><th>Product</th><th class="right">Stock</th><th class="right">Min</th></tr>${lowStock.map(p=>`<tr><td>${esc(p.name)} <span class="muted">(${esc(p.sku)})</span></td><td class="right ${stock(p.id)<=0?'red':''}">${stock(p.id)}</td><td class="right">${p.minStock}</td></tr>`).join('')}</table>` : `<div class="empty-state">All stock levels healthy ✅</div>`}
      </div>
    </div>
  `;
}

app.saveCustomer = async (id) => {
  const name = document.getElementById('f_name').value.trim();
  const mobile = document.getElementById('f_mobile').value.trim();
  if (!name) return toast('Customer name is required', 'error');
  if (mobile && !/^\d{10}$/.test(mobile.replace(/\D/g,'').slice(-10))) return toast('Enter a valid 10-digit mobile number', 'error');
  const gstin = document.getElementById('f_gstin').value.trim().toUpperCase();
  if (gstin && !/^[0-9]{2}[A-Z0-9]{10}[0-9][A-Z][0-9A-Z]$/.test(gstin)) return toast('GSTIN format looks invalid (expected 15 characters)', 'error');
  const data = {
    name, customerType: document.getElementById('f_type').value, contact: document.getElementById('f_contact').value.trim(),
    mobile, email: document.getElementById('f_email').value.trim(), gstin, pan: document.getElementById('f_pan').value.trim().toUpperCase(),
    city: document.getElementById('f_city').value.trim(), state: document.getElementById('f_state').value.trim() || SETTINGS.companyState,
    pin: document.getElementById('f_pin').value.trim(), creditLimit: num(document.getElementById('f_limit').value),
    creditDays: num(document.getElementById('f_days').value), address: document.getElementById('f_addr').value.trim(),
  };
  if (id) {
    const c = DB.customers.find(x=>x.id===id); const before = {...c}; Object.assign(c, data);
    logAudit('Update','Customer',id,`Updated customer ${name}`,before,c);
  } else {
    data.id = uid('CUS'); data.openingBalance = num(document.getElementById('f_open').value); data.createdAt = nowISO(); data.status='active';
    DB.customers.push(data);
    logAudit('Create','Customer',data.id,`Created customer ${name}`);
  }
  await persist('customers'); await persist('auditLog');
  closeModal(); toast('Customer saved', 'success'); route();
};
app.viewCustomer = (id) => {

app.saveStockAdjustment = async (id) => {

  if (qty === 0) return toast('Enter a non-zero quantity change','error');

};

/* ================================== SALES ================================== */
function statusBadge(status) {
  const map = { Draft:'badge-gray', Confirmed:'badge-navy', Paid:'badge-green', 'Partially Paid':'badge-amber', Credit:'badge-amber', Cancelled:'badge-red' };
  return `<span class="badge ${map[status]||'badge-gray'}">${status}</span>`;
}
function computeInvoiceDisplayStatus(inv) {
  if (inv.status === 'Cancelled' || inv.status === 'Draft') return inv.status;
  const out = invoiceOutstanding(inv);
  if (out <= 0.005) return 'Paid';
  if (out < inv.grandTotal) return 'Partially Paid';
  return 'Credit';
}
function renderSales(el) {
  el.innerHTML = `
    <div class="toolbar">
      <div class="left">
        <input id="salSearch" placeholder="Search invoice #, customer..." style="width:240px">
        <select id="salStatus"><option value="">All Status</option>${['Draft','Confirmed','Cancelled'].map(s=>`<option>${s}</option>`).join('')}</select>
        <input id="salFrom" type="date"><span class="muted">to</span><input id="salTo" type="date">
      </div>
      <button class="btn-accent" onclick="app.newSaleInvoice()">+ New Sale Invoice</button>
    </div>
    <div class="panel"><div class="tbl-wrap" id="salTableWrap"></div></div>`;
  ['salSearch','salStatus','salFrom','salTo'].forEach(id => document.getElementById(id).addEventListener('input', renderSalTable));
  renderSalTable();
}
function renderSalTable() {
  const wrap = document.getElementById('salTableWrap'); if(!wrap) return;
  const q=(document.getElementById('salSearch').value||'').toLowerCase();
  const status = document.getElementById('salStatus').value;
  const from = document.getElementById('salFrom').value, to = document.getElementById('salTo').value;
  let list = DB.salesInvoices.filter(i => {
    const cust = DB.customers.find(c=>c.id===i.customerId);
    if (q && !((cust&&cust.name||'')+' '+i.number).toLowerCase().includes(q)) return false;
    if (status && i.status !== status) return false;
    if (from && i.date < from) return false;
    if (to && i.date > to) return false;
    return true;
  }).sort((a,b)=>b.date.localeCompare(a.date) || b.createdAt.localeCompare(a.createdAt));
  if (!list.length) { wrap.innerHTML = `<div class="empty-state"><div class="big">🧾</div>No sales invoices found.</div>`; return; }
  wrap.innerHTML = `<table><tr><th>Invoice #</th><th>Date</th><th>Customer</th><th class="right">Total</th><th class="right">Outstanding</th><th>Status</th><th></th></tr>
    ${list.map(i => { const cust = DB.customers.find(c=>c.id===i.customerId);
      return `<tr><td class="mono">${i.number}</td><td>${i.date}</td><td>${esc(cust?cust.name:'—')}</td><td class="right">${inr(i.grandTotal)}</td>
      <td class="right">${inr(invoiceOutstanding(i))}</td><td>${statusBadge(computeInvoiceDisplayStatus(i))}</td>
      <td><button class="btn-ghost btn-sm" onclick="app.viewInvoice('${i.id}')">View</button></td></tr>`;
    }).join('')}</table>`;
}

app.updateSaleLine = (key, field, value) => {
  const l = app._saleLines.find(x=>x.key===key); if(!l) return;
  if (field==='productId') { l.productId = value; const p = DB.products.find(x=>x.id===value); l.rate = p.sellingPrice; renderSaleLines(); }
  else l[field] = field==='qty'||field==='rate'||field==='discountPct' ? num(value) : value;
  app.recalcSaleForm();
};
app.recalcSaleForm = () => {
  const custEl = document.getElementById('s_customer'); if(!custEl) return;
  const cust = DB.customers.find(c=>c.id===custEl.value);
  const sameState = cust && cust.state === SETTINGS.companyState;
  const freight = num(document.getElementById('s_freight').value);
  let taxable=0,cgst=0,sgst=0,igst=0;
  app._saleLines.forEach(l => {
    const p = DB.products.find(x=>x.id===l.productId); if(!p) return;
    const c = calcLine(l.qty, l.rate, l.discountPct, p.gstRate, sameState);
    taxable+=c.taxable; cgst+=c.cgst; sgst+=c.sgst; igst+=c.igst;
    const row = document.querySelector(`tr[data-key="${l.key}"]`);
    if (row) { row.querySelector('.lg-rate').textContent = p.gstRate+'%'; row.querySelector('.lg-total').textContent = inr(c.total); }
  });
  const grand = round2(taxable+cgst+sgst+igst+freight);
  document.getElementById('s_totals').innerHTML = `Taxable: ${inr(taxable)} &nbsp; ${sameState?`CGST: ${inr(cgst)} + SGST: ${inr(sgst)}`:`IGST: ${inr(igst)}`} &nbsp; Freight: ${inr(freight)}<br><b style="font-size:17px">Grand Total: ${inr(grand)}</b>`;
  const mode = document.getElementById('s_mode').value;
  document.getElementById('s_paidWrap').style.display = mode==='Partial' ? 'block' : 'none';
  // credit limit warning
  const warnEl = document.getElementById('s_creditWarn');
  if (cust) {
    const projected = customerOutstanding(cust.id) + grand;
    if (cust.creditLimit > 0 && projected > cust.creditLimit) {
      warnEl.innerHTML = `<div class="badge badge-red" style="display:block;padding:8px 12px;margin-bottom:10px">⚠️ CREDIT LIMIT EXCEEDED — Outstanding after this sale would be ${inr(projected)}, limit is ${inr(cust.creditLimit)}.</div>`;
    } else warnEl.innerHTML='';
  }
};
app.saveSaleInvoice = async (status) => {
  const customerId = document.getElementById('s_customer').value;
  const date = document.getElementById('s_date').value || todayISO();
  const mode = document.getElementById('s_mode').value;
  const freight = num(document.getElementById('s_freight').value);
  const notes = document.getElementById('s_notes').value;
  if (app._saleLines.some(l => l.qty <= 0)) return toast('Quantity must be positive on every line','error');
  if (app._saleLines.some(l => l.rate < 0)) return toast('Rate cannot be negative','error');
  for (const l of app._saleLines) {
    if (status === 'Confirmed') {
      const avail = stock(l.productId);
      if (avail < l.qty) { const p = DB.products.find(x=>x.id===l.productId); return toast(`Insufficient stock for ${p.name}: available ${avail}, requested ${l.qty}`, 'error'); }
    }
  }
  const cust = DB.customers.find(c=>c.id===customerId);
  const dueDate = addDays(date, cust.creditDays||SETTINGS.defaultCreditDays);
  const inv = createSalesInvoiceObj({ customerId, date, dueDate, paymentMode: mode, status, lines: app._saleLines, freight, notes });

  if (status === 'Confirmed' && cust.creditLimit > 0) {
    const projected = customerOutstanding(cust.id) + inv.grandTotal;
    if (projected > cust.creditLimit && SETTINGS.creditPolicy === 'block') {
      return toast('Sale blocked: credit limit exceeded (see Settings > Credit Policy)', 'error');
    }
  }

  DB.salesInvoices.push(inv);
  if (status === 'Confirmed') applyStockForSale(inv);
  logAudit('Create','SalesInvoice',inv.id,`${status} sale invoice ${inv.number} for ${inr(inv.grandTotal)}`);

  // immediate cash/upi/bank/partial payment
  if (status === 'Confirmed' && (mode==='Cash'||mode==='UPI'||mode==='Bank')) {
    const rec = { id: uid('RCT'), number: nextNumber('RCT','GW-RCT'), date, customerId, amount: inv.grandTotal, mode,
      reference: 'Auto — full payment at sale', allocations: [{invoiceId: inv.id, amount: inv.grandTotal}], createdAt: nowISO() };
    DB.receipts.push(rec);
    logAudit('Create','Receipt',rec.id,`Auto receipt ${rec.number} for invoice ${inv.number}`);
  } else if (status==='Confirmed' && mode==='Partial') {
    const paidNow = num(document.getElementById('s_paidNow').value);
    if (paidNow > 0) {
      const rec = { id: uid('RCT'), number: nextNumber('RCT','GW-RCT'), date, customerId, amount: Math.min(paidNow, inv.grandTotal), mode:'Cash',
        reference: 'Partial payment at sale', allocations: [{invoiceId: inv.id, amount: Math.min(paidNow, inv.grandTotal)}], createdAt: nowISO() };
      DB.receipts.push(rec);
      logAudit('Create','Receipt',rec.id,`Partial receipt ${rec.number} for invoice ${inv.number}`);
    }
  }
  // warranty records for battery sales
  if (status === 'Confirmed') {
    inv.lines.forEach(l => {
      const p = DB.products.find(x=>x.id===l.productId); if(!p) return;
      for (let i=0;i<l.qty;i++) {
        DB.warranties.push({ id: uid('WAR'), productId: p.id, invoiceId: inv.id, customerId, saleDate: date,
          warrantyMonths: p.warrantyMonths, expiryDate: addMonths(date, p.warrantyMonths), status:'Active', serial: '' });
      }
    });
  }
  await persistAll();
  closeModal(); toast(`Invoice ${inv.number} ${status==='Draft'?'saved as draft':'created'}`, 'success'); route();
};
function addMonths(iso, months) { const d=new Date(iso); d.setMonth(d.getMonth()+(months||0)); return d.toISOString().slice(0,10); }

app.cancelInvoice = async (id) => {
  const inv = DB.salesInvoices.find(i=>i.id===id); if(!inv || inv.status==='Cancelled') return;
  if (invoiceAllocatedAmount(inv.id) > 0) { if(!confirm('This invoice has payments allocated. Cancelling will keep those receipts as on-account credit for the customer. Continue?')) return; }
  else if (!confirm('Cancel this invoice? Stock will be restored.')) return;
  const before = {...inv};
  if (inv.status === 'Confirmed') reverseStockForSale(inv);
  inv.status = 'Cancelled';
  logAudit('Cancel','SalesInvoice',id,`Cancelled invoice ${inv.number}`,before,inv);
  await persist('salesInvoices'); await persist('stockTx'); await persist('auditLog');
  closeModal(); toast('Invoice cancelled — stock restored', 'success'); route();
};
app.whatsappShare = (id) => {
  const inv = DB.salesInvoices.find(i=>i.id===id); const cust = DB.customers.find(c=>c.id===inv.customerId);
  const out = invoiceOutstanding(inv);
  const msg = `Hi ${cust.name}, here is your invoice from ${SETTINGS.companyName}:%0AInvoice: ${inv.number}%0AAmount: ${inr(inv.grandTotal)}%0AAmount Paid: ${inr(inv.grandTotal-out)}%0AOutstanding: ${inr(out)}%0AThank you for your business!`;
  const phone = (cust.mobile||'').replace(/\D/g,'');
  window.open(`https://wa.me/${phone?('91'+phone.slice(-10)):''}?text=${msg}`, '_blank');
};

app.cancelPurchase = async (id) => {
  const p = DB.purchaseInvoices.find(x=>x.id===id); if(!p||p.status==='Cancelled') return;
  if (!confirm('Cancel this purchase? Stock added by it will be reversed.')) return;
  const before = {...p};
  p.lines.forEach(l => recordStockTx(l.productId, -Math.abs(l.qty), 'Stock Adjustment', 'Purchase Cancelled', p.id, 'Reversal of '+p.number));
  p.status = 'Cancelled';
  logAudit('Cancel','PurchaseInvoice',id,`Cancelled purchase ${p.number}`,before,p);
  await persist('purchaseInvoices'); await persist('stockTx'); await persist('auditLog');
  closeModal(); toast('Purchase cancelled — stock reversed','success'); route();
};

app.recalcReturn = () => {
  const inv = DB.salesInvoices.find(i=>i.id===document.getElementById('r_invoice').value);
  let total = 0;
  document.querySelectorAll('#r_lines tr[data-idx]').forEach(tr => {
    const idx = +tr.dataset.idx; const l = inv.lines[idx]; const retQty = num(tr.querySelector('input').value);
    const unitRate = l.total / l.qty; // proportionate incl. tax
    const refund = round2(retQty * unitRate);

app.saveSalesReturn = async () => {

  document.querySelectorAll('#r_lines tr[data-idx]').forEach(tr => {

    if (retQty > 0) { const unitRate = l.total/l.qty; const refund = round2(retQty*unitRate); total += refund;

app.savePurchaseReturn = async () => {
  const purId = document.getElementById('pr_purchase').value;
  const pur = DB.purchaseInvoices.find(p=>p.id===purId);
  const reason = document.getElementById('pr_reason').value.trim();
  const lines = []; let total = 0;
  document.querySelectorAll('#pr_lines tr[data-idx]').forEach(tr => {
    const idx=+tr.dataset.idx; const l=pur.lines[idx]; const retQty=num(tr.querySelector('input').value);
    if (retQty>0) { const unitRate=l.total/l.qty; const debit=round2(retQty*unitRate); total+=debit; lines.push({productId:l.productId,name:l.name,qty:retQty,debit}); }
  });
  if (!lines.length) return toast('Enter a return quantity for at least one item','error');
  const availabilityOk = lines.every(l => stock(l.productId) >= l.qty);
  if (!availabilityOk) return toast('Cannot return more than current available stock for an item','error');
  const pr = { id: uid('PR'), number: nextNumber('DN','GW-DN'), date: todayISO(), purchaseId: purId, supplierId: pur.supplierId,

};

  wrap.innerHTML = `<table><tr><th></th><th>Invoice</th><th>Date</th><th class="right">Outstanding</th><th class="right">Allocate</th></tr>
    ${openInvs.map(i=>`<tr data-inv="${i.id}"><td><input type="checkbox" ${app._preselectInvoice===i.id?'checked':''} onchange="app.recalcReceiptAlloc()"></td><td>${i.number}</td><td>${i.date}</td>
      <td class="right">${inr(invoiceOutstanding(i))}</td><td class="right"><input type="number" style="width:100px" value="${app._preselectInvoice===i.id?invoiceOutstanding(i).toFixed(2):'0'}" oninput="app.recalcReceiptAlloc()"></td></tr>`).join('')}</table>`;

app.recalcReceiptAlloc = () => {
  const amount = num(document.getElementById('rc_amount').value);
  let allocated = 0;
  document.querySelectorAll('#rc_invoices tr[data-inv]').forEach(tr => {
    const checked = tr.querySelector('input[type=checkbox]').checked;
    const val = num(tr.querySelector('input[type=number]').value);
    if (checked) allocated += val;
  });
  const el = document.getElementById('rc_allocStatus'); if(!el) return;
  const remaining = round2(amount - allocated);
  if (allocated > amount + 0.01) el.innerHTML = `<span style="color:#d64545">⚠️ Allocated (${inr(allocated)}) exceeds amount received (${inr(amount)}).</span>`;
  else el.innerHTML = `Allocated: ${inr(allocated)} &nbsp; | &nbsp; On Account: ${inr(Math.max(0,remaining))}`;
};
app.saveReceipt = async () => {
  const customerId = document.getElementById('rc_customer').value;
  const date = document.getElementById('rc_date').value || todayISO();
  const amount = num(document.getElementById('rc_amount').value);
  const mode = document.getElementById('rc_mode').value;
  const reference = document.getElementById('rc_ref').value.trim();
  if (amount <= 0) return toast('Enter a valid amount received','error');
  const allocations = [];
  let allocSum = 0;
  document.querySelectorAll('#rc_invoices tr[data-inv]').forEach(tr => {
    const checked = tr.querySelector('input[type=checkbox]').checked;
    const val = num(tr.querySelector('input[type=number]').value);
    if (checked && val > 0) {
      const invId = tr.dataset.inv; const inv = DB.salesInvoices.find(i=>i.id===invId);
      const maxAlloc = invoiceOutstanding(inv);
      if (val > maxAlloc + 0.01) { toast(`Allocation to ${inv.number} exceeds its outstanding balance`, 'error'); throw new Error('stop'); }
      allocations.push({ invoiceId: invId, amount: round2(val) }); allocSum += val;
    }
  });
  if (allocSum > amount + 0.01) return toast('Total allocation cannot exceed amount received','error');
  const rec = { id: uid('RCT'), number: nextNumber('RCT','GW-RCT'), date, customerId, amount: round2(amount), mode, reference, allocations, createdAt: nowISO() };
  DB.receipts.push(rec);
  logAudit('Create','Receipt',rec.id,`Receipt ${rec.number} of ${inr(rec.amount)} from customer`);
  await persist('receipts'); await persist('auditLog');
  closeModal(); toast(`Receipt ${rec.number} recorded`,'success'); route();
};

/* ================================ WARRANTY ================================= */
function renderWarranty(el) {
  const today = todayISO();
  const withStatus = DB.warranties.map(w => {
    let status = w.status;
    if (status !== 'Replaced') {
      const daysLeft = (new Date(w.expiryDate) - new Date(today)) / 86400000;
      status = daysLeft < 0 ? 'Expired' : daysLeft <= 60 ? 'Expiring Soon' : 'Active';
    }
    return { ...w, computedStatus: status };
  });
  el.innerHTML = `
    <div class="toolbar"><div class="left"><select id="warFilter"><option value="">All Statuses</option>${['Active','Expiring Soon','Expired','Replaced'].map(s=>`<option>${s}</option>`).join('')}</select></div></div>
    <div class="panel"><div class="tbl-wrap" id="warTableWrap"></div></div>`;
  document.getElementById('warFilter').addEventListener('change', () => renderWarTable(withStatus));
  renderWarTable(withStatus);
}
function renderWarTable(list) {
  const wrap = document.getElementById('warTableWrap');
  const filter = document.getElementById('warFilter').value;
  const shown = filter ? list.filter(w=>w.computedStatus===filter) : list;
  if (!shown.length) { wrap.innerHTML = `<div class="empty-state"><div class="big">🛡️</div>No warranty records match.</div>`; return; }
  const badge = s => ({'Active':'badge-green','Expiring Soon':'badge-amber','Expired':'badge-red','Replaced':'badge-navy'}[s]||'badge-gray');
  wrap.innerHTML = `<table><tr><th>Product</th><th>Customer</th><th>Invoice</th><th>Sale Date</th><th>Expiry</th><th>Status</th><th></th></tr>
    ${shown.map(w=>{ const p=DB.products.find(x=>x.id===w.productId); const c=DB.customers.find(x=>x.id===w.customerId); const inv=DB.salesInvoices.find(x=>x.id===w.invoiceId);
      return `<tr><td>${esc(p?p.name:'')}</td><td>${esc(c?c.name:'')}</td><td>${inv?inv.number:'—'}</td><td>${w.saleDate}</td><td>${w.expiryDate}</td>
      <td><span class="badge ${badge(w.computedStatus)}">${w.computedStatus}</span></td>
      <td>${w.computedStatus!=='Replaced' ? `<button class="btn-ghost btn-sm" onclick="app.replaceWarranty('${w.id}')">Mark Replaced</button>`:''}</td></tr>`;
    }).join('')}</table>`;
}
app.replaceWarranty = async (id) => {
  const w = DB.warranties.find(x=>x.id===id); if(!w) return;
  if (!confirm('Mark this battery as replaced under warranty? This does not create a new sale (no double-counting) but does record a new warranty period and a stock movement.')) return;
  w.status = 'Replaced';
  recordStockTx(w.productId, -1, 'Warranty Replacement', 'Warranty', w.id, 'Replacement unit issued');
  DB.warranties.push({ id: uid('WAR'), productId: w.productId, invoiceId: w.invoiceId, customerId: w.customerId, saleDate: todayISO(),
    warrantyMonths: w.warrantyMonths, expiryDate: addMonths(todayISO(), w.warrantyMonths), status:'Active', serial:'', replacementOf: w.id });
  logAudit('WarrantyReplace','Warranty',id,'Warranty replacement issued (no sale recorded)');
  await persist('warranties'); await persist('stockTx'); await persist('auditLog');
  toast('Replacement recorded — stock reduced by 1, no sale created','success'); route();
};

/* ================================ REPORTS =================================== */
const REPORT_LIST = [
  'Sales Register','Purchase Register','Sales Return Register','Purchase Return Register',
  'Customer Ledger','Supplier Ledger','Outstanding Receivables','Outstanding Payables',
  'Stock Report','Stock Valuation','GST Sales Summary','GST Purchase Summary',
  'Collection Report','Payment Report','Profit Report','Overdue Report','Warranty Report'
];
function renderReports(el) {
  el.innerHTML = `
    <div class="toolbar"><div class="left">
      <select id="repSelect">${REPORT_LIST.map(r=>`<option>${r}</option>`).join('')}</select>
      <input id="repFrom" type="date"><span class="muted">to</span><input id="repTo" type="date">
      <select id="repEntity"></select>
    </div>
    <div><button class="btn-ghost" onclick="app.exportCSV()">⇩ Export CSV</button> <button class="btn-ghost" onclick="window.print()">🖨️ Print</button></div>
    </div>
    <div class="panel"><div class="tbl-wrap" id="repTableWrap"></div></div>`;
  document.getElementById('repSelect').addEventListener('change', renderReportBody);
  document.getElementById('repFrom').addEventListener('input', renderReportBody);
  document.getElementById('repTo').addEventListener('input', renderReportBody);
  renderReportBody();
}
function renderReportBody() {
  const rep = document.getElementById('repSelect').value;
  const from = document.getElementById('repFrom').value, to = document.getElementById('repTo').value;
  const entityWrap = document.getElementById('repEntity');
  const inRange = (d) => (!from || d>=from) && (!to || d<=to);
  let rows = [], headers = [];
  entityWrap.style.display = 'none'; entityWrap.innerHTML='';

  if (rep === 'Sales Register') {
    headers = ['Invoice #','Date','Customer','Taxable','GST','Freight','Grand Total','Status'];
    rows = DB.salesInvoices.filter(i=>inRange(i.date) && i.status!=='Cancelled').map(i=>{ const c=DB.customers.find(x=>x.id===i.customerId);
      return [i.number,i.date,c?c.name:'',inr(i.taxable),inr(i.cgst+i.sgst+i.igst),inr(i.freight),inr(i.grandTotal),computeInvoiceDisplayStatus(i)]; });
  } else if (rep === 'Purchase Register') {
    headers = ['Purchase #','Date','Supplier','Taxable','GST','Freight','Grand Total','Status'];
    rows = DB.purchaseInvoices.filter(p=>inRange(p.date) && p.status!=='Cancelled').map(p=>{ const s=DB.suppliers.find(x=>x.id===p.supplierId);
      return [p.number,p.date,s?s.name:'',inr(p.taxable),inr(p.cgst+p.sgst+p.igst),inr(p.freight),inr(p.grandTotal),p.status]; });
  } else if (rep === 'Sales Return Register') {
    headers = ['Credit Note #','Date','Invoice','Customer','Amount'];
    rows = DB.salesReturns.filter(r=>inRange(r.date)).map(r=>{ const c=DB.customers.find(x=>x.id===r.customerId); const inv=DB.salesInvoices.find(x=>x.id===r.invoiceId);
      return [r.number,r.date,inv?inv.number:'',c?c.name:'',inr(r.creditNoteAmount)]; });
  } else if (rep === 'Purchase Return Register') {
    headers = ['Debit Note #','Date','Purchase','Supplier','Amount'];
    rows = DB.purchaseReturns.filter(r=>inRange(r.date)).map(r=>{ const s=DB.suppliers.find(x=>x.id===r.supplierId); const p=DB.purchaseInvoices.find(x=>x.id===r.purchaseId);
      return [r.number,r.date,p?p.number:'',s?s.name:'',inr(r.debitNoteAmount)]; });
  } else if (rep === 'Customer Ledger') {
    entityWrap.style.display='inline-block'; entityWrap.innerHTML = `<option value="">Select customer...</option>` + DB.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
    entityWrap.onchange = renderReportBody;
    const cid = entityWrap.value;
    headers = ['Date','Type','Reference','Debit','Credit','Balance'];
    if (cid) {
      const entries = [];
      DB.salesInvoices.filter(i=>i.customerId===cid && i.status!=='Cancelled' && i.status!=='Draft').forEach(i=>entries.push({date:i.date,type:'Invoice',ref:i.number,debit:i.grandTotal,credit:0}));
      DB.receipts.filter(r=>r.customerId===cid).forEach(r=>entries.push({date:r.date,type:'Receipt',ref:r.number,debit:0,credit:r.amount}));
      DB.salesReturns.filter(r=>r.customerId===cid).forEach(r=>entries.push({date:r.date,type:'Credit Note',ref:r.number,debit:0,credit:r.creditNoteAmount}));
      entries.sort((a,b)=>a.date.localeCompare(b.date));
      let bal=0; rows = entries.filter(e=>inRange(e.date)).map(e=>{ bal += e.debit - e.credit; return [e.date,e.type,e.ref,e.debit?inr(e.debit):'',e.credit?inr(e.credit):'',inr(bal)]; });
    }
  } else if (rep === 'Supplier Ledger') {
    entityWrap.style.display='inline-block'; entityWrap.innerHTML = `<option value="">Select supplier...</option>` + DB.suppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');
    entityWrap.onchange = renderReportBody;
    const sid = entityWrap.value;
    headers = ['Date','Type','Reference','Credit(Payable)','Debit(Paid)','Balance'];
    if (sid) {
      const entries = [];
      DB.purchaseInvoices.filter(p=>p.supplierId===sid && p.status!=='Cancelled').forEach(p=>entries.push({date:p.date,type:'Purchase',ref:p.number,credit:p.grandTotal,debit:0}));
      DB.payments.filter(p=>p.supplierId===sid).forEach(p=>entries.push({date:p.date,type:'Payment',ref:p.number,credit:0,debit:p.amount}));
      DB.purchaseReturns.filter(r=>r.supplierId===sid).forEach(r=>entries.push({date:r.date,type:'Debit Note',ref:r.number,credit:0,debit:r.debitNoteAmount}));
      entries.sort((a,b)=>a.date.localeCompare(b.date));
      let bal=0; rows = entries.filter(e=>inRange(e.date)).map(e=>{ bal += e.credit - e.debit; return [e.date,e.type,e.ref,e.credit?inr(e.credit):'',e.debit?inr(e.debit):'',inr(bal)]; });
    }
  } else if (rep === 'Outstanding Receivables') {
    headers = ['Customer','State','Total Sales','Outstanding','Overdue','Credit Limit','Status'];
    rows = DB.customers.map(c=>[c.name,c.state,inr(customerTotalSales(c.id)),inr(customerOutstanding(c.id)),inr(customerOverdue(c.id)),inr(c.creditLimit),creditStatus(c)]).filter(r=>num(r[3].replace(/[^0-9.-]/g,''))>0 || true);
  } else if (rep === 'Outstanding Payables') {
    headers = ['Supplier','State','Total Purchases','Outstanding'];
    rows = DB.suppliers.map(s=>[s.name,s.state,inr(supplierTotalPurchases(s.id)),inr(supplierOutstanding(s.id))]);
  } else if (rep === 'Stock Report') {
    headers = ['SKU','Product','Category','Current Stock','Min Stock','Status'];
    rows = DB.products.map(p=>[p.sku,p.name,p.category,stock(p.id),p.minStock, stock(p.id)<=p.minStock?'⚠️ Low':'OK']);
  } else if (rep === 'Stock Valuation') {
    headers = ['SKU','Product','Stock','Purchase Price','Stock Value'];
    rows = DB.products.map(p=>[p.sku,p.name,stock(p.id),inr(p.purchasePrice),inr(stock(p.id)*p.purchasePrice)]);
  } else if (rep === 'GST Sales Summary') {
    headers = ['Invoice #','Date','Customer State','Taxable','CGST','SGST','IGST','Total'];
    rows = DB.salesInvoices.filter(i=>inRange(i.date)&&i.status!=='Cancelled').map(i=>{ const c=DB.customers.find(x=>x.id===i.customerId);
      return [i.number,i.date,c?c.state:'',inr(i.taxable),inr(i.cgst),inr(i.sgst),inr(i.igst),inr(i.grandTotal)]; });
  } else if (rep === 'GST Purchase Summary') {
    headers = ['Purchase #','Date','Supplier State','Taxable','CGST','SGST','IGST','Total'];
    rows = DB.purchaseInvoices.filter(p=>inRange(p.date)&&p.status!=='Cancelled').map(p=>{ const s=DB.suppliers.find(x=>x.id===p.supplierId);
      return [p.number,p.date,s?s.state:'',inr(p.taxable),inr(p.cgst),inr(p.sgst),inr(p.igst),inr(p.grandTotal)]; });
  } else if (rep === 'Collection Report') {
    headers = ['Receipt #','Date','Customer','Mode','Amount'];
    rows = DB.receipts.filter(r=>inRange(r.date)).map(r=>{ const c=DB.customers.find(x=>x.id===r.customerId); return [r.number,r.date,c?c.name:'',r.mode,inr(r.amount)]; });
  } else if (rep === 'Payment Report') {
    headers = ['Payment #','Date','Supplier','Mode','Amount'];
    rows = DB.payments.filter(p=>inRange(p.date)).map(p=>{ const s=DB.suppliers.find(x=>x.id===p.supplierId); return [p.number,p.date,s?s.name:'',p.mode,inr(p.amount)]; });
  } else if (rep === 'Profit Report') {
    headers = ['Invoice #','Date','Revenue (Taxable)','Est. COGS','Gross Profit'];
    rows = DB.salesInvoices.filter(i=>inRange(i.date)&&i.status!=='Cancelled'&&i.status!=='Draft').map(i=>{
      let cogs=0; i.lines.forEach(l=>{ const p=DB.products.find(x=>x.id===l.productId); cogs += (p?p.purchasePrice:0)*l.qty; });
      return [i.number,i.date,inr(i.taxable),inr(cogs),inr(round2(i.taxable-cogs))];
    });
  } else if (rep === 'Overdue Report') {
    headers = ['Customer','Invoice #','Due Date','Days Overdue','Outstanding'];
    const today = todayISO();
    DB.salesInvoices.filter(i=>i.status==='Confirmed' && i.dueDate<today && invoiceOutstanding(i)>0.005).forEach(i=>{
      const c=DB.customers.find(x=>x.id===i.customerId);
      const days = Math.floor((new Date(today)-new Date(i.dueDate))/86400000);
      rows.push([c?c.name:'',i.number,i.dueDate,days,inr(invoiceOutstanding(i))]);
    });
  } else if (rep === 'Warranty Report') {
    headers = ['Product','Customer','Sale Date','Expiry','Status'];
    const today = todayISO();
    rows = DB.warranties.map(w=>{ const p=DB.products.find(x=>x.id===w.productId); const c=DB.customers.find(x=>x.id===w.customerId);
      let status=w.status; if(status!=='Replaced'){ const d=(new Date(w.expiryDate)-new Date(today))/86400000; status = d<0?'Expired':d<=60?'Expiring Soon':'Active'; }
      return [p?p.name:'',c?c.name:'',w.saleDate,w.expiryDate,status]; });
  }

  renderReports._headers = headers; renderReports._rows = rows;
  const wrap = document.getElementById('repTableWrap');
  if (!rows.length) { wrap.innerHTML = `<div class="empty-state"><div class="big">📈</div>No data for this report / filter combination.</div>`; return; }
  wrap.innerHTML = `<table><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${typeof c==='number'?'right':''}">${c}</td>`).join('')}</tr>`).join('')}</table>`;
}
app.exportCSV = () => {
  const headers = renderReports._headers, rows = renderReports._rows;
  if (!headers || !rows || !rows.length) return toast('Nothing to export','error');
  const csv = [headers.join(','), ...rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(','))].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'goodwin-report.csv'; a.click();
};

/* ================================ AUDIT LOG ================================= */
function renderAuditLog(el) {
  el.innerHTML = `<div class="panel"><div class="tbl-wrap" id="alTableWrap"></div></div>`;
  const wrap = document.getElementById('alTableWrap');
  if (!DB.auditLog.length) { wrap.innerHTML = `<div class="empty-state"><div class="big">📜</div>No activity recorded yet.</div>`; return; }
  wrap.innerHTML = `<table><tr><th>Time</th><th>User</th><th>Action</th><th>Entity</th><th>Summary</th></tr>
    ${DB.auditLog.map(a=>`<tr><td>${new Date(a.ts).toLocaleString()}</td><td>${esc(a.user)}</td><td><span class="badge badge-navy">${a.action}</span></td><td>${a.entity}</td><td>${esc(a.summary)}</td></tr>`).join('')}
  </table>`;
}

/* ================================ SETTINGS =================================== */
function renderSettings(el) {
  el.innerHTML = `
    <div class="panel">
      <h2>Company Profile</h2>
      <div class="field-grid">
        <div class="field"><label>Company Name</label><input id="st_name" value="${esc(SETTINGS.companyName)}"></div>
        <div class="field"><label>Home State (for GST intra/inter check) *</label><input id="st_state" value="${esc(SETTINGS.companyState)}"></div>
        <div class="field"><label>GSTIN</label><input id="st_gstin" value="${esc(SETTINGS.companyGSTIN)}"></div>
        <div class="field"><label>Phone</label><input id="st_phone" value="${esc(SETTINGS.companyPhone)}"></div>
        <div class="field"><label>Email</label><input id="st_email" value="${esc(SETTINGS.companyEmail)}"></div>
        <div class="field"><label>Default GST Rate (%)</label><input id="st_gst" type="number" value="${SETTINGS.defaultGSTRate}"></div>
        <div class="field"><label>Default Credit Days</label><input id="st_days" type="number" value="${SETTINGS.defaultCreditDays}"></div>
        <div class="field"><label>Credit Policy on Limit Breach</label><select id="st_policy">
          <option value="warn" ${SETTINGS.creditPolicy==='warn'?'selected':''}>Warn only</option>
          <option value="confirm" ${SETTINGS.creditPolicy==='confirm'?'selected':''}>Require confirmation</option>
          <option value="block" ${SETTINGS.creditPolicy==='block'?'selected':''}>Block credit sale</option>
        </select></div>
      </div>
      <div class="field"><label>Address</label><textarea id="st_addr" rows="2" style="width:100%">${esc(SETTINGS.companyAddress)}</textarea></div>
      <div class="field"><label>Bank Details (shown on invoice)</label><input id="st_bank" style="width:100%" value="${esc(SETTINGS.bankDetails)}"></div>
      <div class="field"><label>Invoice Terms & Conditions</label><textarea id="st_terms" rows="2" style="width:100%">${esc(SETTINGS.terms)}</textarea></div>
      <button class="btn-primary" onclick="app.saveSettings()">Save Settings</button>
    </div>
    
    <div class="panel">
      <h2>Supabase Integration</h2>
      <p class="muted">Store your data in Supabase Postgres Database.</p>
      <div class="field">
        <label>Supabase URL</label>
        <input id="st_sb_url" value="${esc(SUPABASE_URL !== 'YOUR_SUPABASE_URL' ? SUPABASE_URL : '')}" placeholder="https://xyz.supabase.co">
      </div>
      <div class="field">
        <label>Supabase Anon Key</label>
        <input id="st_sb_key" type="password" value="${esc(SUPABASE_KEY !== 'YOUR_SUPABASE_KEY' ? SUPABASE_KEY : '')}" placeholder="eyJh...">
      </div>
      <button class="btn-primary" onclick="app.saveSupabase()">Save Supabase Config</button>
      <div style="margin-top: 10px; font-size: 12px;" class="muted">
        <strong>Note:</strong> You must create a table in your Supabase SQL Editor named <code>store</code>:<br>
        <code>CREATE TABLE store ( key TEXT PRIMARY KEY, value JSONB );</code>
      </div>
    </div>
    
    <div class="panel">
      <h2>Data & Storage</h2>
      <p class="muted">Storage mode: <b>${Store.usingRealStorage()?'Supabase (Persistent)':'In-memory demo (resets on reload)'}</b></p>
      <button class="btn-ghost" onclick="app.exportBackup()">⇩ Download Full Backup (JSON)</button>
    </div>
  `;
}
app.saveSettings = async () => {
  SETTINGS = { ...SETTINGS,
    companyName: document.getElementById('st_name').value.trim(),
    companyState: document.getElementById('st_state').value.trim(),
    companyGSTIN: document.getElementById('st_gstin').value.trim(),
    companyPhone: document.getElementById('st_phone').value.trim(),
    companyEmail: document.getElementById('st_email').value.trim(),
    defaultGSTRate: num(document.getElementById('st_gst').value),
    defaultCreditDays: num(document.getElementById('st_days').value),
    creditPolicy: document.getElementById('st_policy').value,
    companyAddress: document.getElementById('st_addr').value.trim(),
    bankDetails: document.getElementById('st_bank').value.trim(),
    terms: document.getElementById('st_terms').value.trim(),
  };
  await persistSettings();
  toast('Settings saved','success');
};
app.saveSupabase = () => {
  const url = document.getElementById('st_sb_url').value.trim();
  const key = document.getElementById('st_sb_key').value.trim();
  
  if(url) localStorage.setItem('gw:supabase_url', url);
  else localStorage.removeItem('gw:supabase_url');
  
  if(key) localStorage.setItem('gw:supabase_key', key);
  else localStorage.removeItem('gw:supabase_key');
  
  toast('Supabase config saved. Reloading app...', 'success');
  setTimeout(() => window.location.reload(), 1000);
}
app.exportBackup = () => {
  const backup = { exportedAt: nowISO(), settings: SETTINGS, counters: COUNTERS, data: DB };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `goodwin-erp-backup-${todayISO()}.json`; a.click();
  toast('Backup downloaded','success');
};

/* =================================== BOOT ==================================== */
async function boot() {
  await loadAll();
  renderSidebar();
  route();
}
boot();
</script>
