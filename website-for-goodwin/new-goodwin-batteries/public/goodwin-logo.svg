<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="100%" height="100%">
  <defs>
    <!-- Primary Gradient -->
    <linearGradient id="gbEnergyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#db631a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Deep Blue / Indigo Gradient -->
    <linearGradient id="gbNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Battery Case Gradient -->
    <linearGradient id="gbCaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3342" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON BADGE (Battery Shield with Lightning) -->
  <g transform="translate(10, 8)">
    <!-- Battery Outer Hexagonal Casing / Heavy Duty Shield -->
    <rect x="12" y="10" width="54" height="60" rx="10" fill="url(#gbCaseGrad)" stroke="#374151" stroke-width="2" />
    
    <!-- Battery Terminal Caps (+ and -) -->
    <rect x="20" y="4" width="12" height="7" rx="2" fill="#9ca3af" />
    <rect x="46" y="4" width="12" height="7" rx="2" fill="#ef4444" />
    
    <!-- Top terminal highlights -->
    <line x1="26" y1="1" x2="26" y2="4" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" />
    <line x1="52" y1="1" x2="52" y2="4" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />

    <!-- Terminal + and - signs -->
    <text x="26" y="22" font-family="Arial, sans-serif" font-size="9" font-weight="900" fill="#9ca3af" text-anchor="middle">-</text>
    <text x="52" y="22" font-family="Arial, sans-serif" font-size="9" font-weight="900" fill="#ef4444" text-anchor="middle">+</text>

    <!-- Inner Battery Power Indicator Bars -->
    <rect x="18" y="28" width="42" height="3" rx="1.5" fill="#374151" />
    <rect x="18" y="34" width="42" height="3" rx="1.5" fill="#374151" />
    <rect x="18" y="60" width="42" height="3" rx="1.5" fill="#374151" />

    <!-- High Voltage Lightning Bolt Emblem -->
    <path d="M43 19 L25 43 L37 43 L33 63 L53 37 L41 37 Z" fill="url(#gbEnergyGrad)" filter="url(#subtleGlow)" />
  </g>

  <!-- BRAND NAME & TYPOGRAPHY -->
  <g transform="translate(92, 0)">
    <!-- GOODWIN Primary Wordmark -->
    <text x="0" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" fill="#0f172a">
      GOOD<tspan fill="#db631a">WIN</tspan>
    </text>

    <!-- BATTERIES Secondary Line -->
    <text x="2" y="64" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="4.5" fill="#3b4252">
      BATTERIES PVT. LTD.
    </text>

    <!-- Estd / Automotive Line -->
    <text x="2" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" letter-spacing="1.5" fill="#64748b">
      AUTOMOTIVE • INVERTER • SOLAR
    </text>

    <!-- Decorative Accent Line -->
    <rect x="220" y="73" width="70" height="2" rx="1" fill="url(#gbEnergyGrad)" />
  </g>
</svg>
