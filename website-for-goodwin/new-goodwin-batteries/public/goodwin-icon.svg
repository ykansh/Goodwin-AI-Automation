<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%">
  <defs>
    <linearGradient id="iconEnergyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#db631a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="iconCaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3342" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(0, 0)">
    <!-- Battery Outer Hexagonal Casing / Heavy Duty Shield -->
    <rect x="13" y="14" width="54" height="60" rx="10" fill="url(#iconCaseGrad)" stroke="#374151" stroke-width="2" />
    
    <!-- Battery Terminal Caps (+ and -) -->
    <rect x="21" y="8" width="12" height="7" rx="2" fill="#9ca3af" />
    <rect x="47" y="8" width="12" height="7" rx="2" fill="#ef4444" />
    
    <!-- Top terminal highlights -->
    <line x1="27" y1="5" x2="27" y2="8" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" />
    <line x1="53" y1="5" x2="53" y2="8" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />

    <!-- Terminal + and - signs -->
    <text x="27" y="26" font-family="Arial, sans-serif" font-size="9" font-weight="900" fill="#9ca3af" text-anchor="middle">-</text>
    <text x="53" y="26" font-family="Arial, sans-serif" font-size="9" font-weight="900" fill="#ef4444" text-anchor="middle">+</text>

    <!-- Inner Battery Power Indicator Bars -->
    <rect x="19" y="32" width="42" height="3" rx="1.5" fill="#374151" />
    <rect x="19" y="38" width="42" height="3" rx="1.5" fill="#374151" />
    <rect x="19" y="64" width="42" height="3" rx="1.5" fill="#374151" />

    <!-- High Voltage Lightning Bolt Emblem -->
    <path d="M44 23 L26 47 L38 47 L34 67 L54 41 L42 41 Z" fill="url(#iconEnergyGrad)" filter="url(#iconGlow)" />
  </g>
</svg>
