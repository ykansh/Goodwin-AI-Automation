<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goodwin Batteries — ERP + Ledger Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --navy: #0f2340;
    --navy2: #16325c;
    --navy-dark: #091527;
    --accent: #f5a623;
    --accent2: #ffb840;
    --accent-dim: #fdecc8;
    --bg: #f3f5f8;
    --card: #ffffff;
    --line: #e3e7ee;
    --text: #1c2733;
    --muted: #6b7889;
    --green: #10b981;
    --green-dim: #e6f4ea;
    --red: #ef4444;
    --red-dim: #fce8e6;
    --amber: #f59e0b;
    --amber-dim: #fef3c7;
    --blue: #3b82f6;
    --blue-dim: #eff6ff;
    --radius: 10px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    font-size: 13.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font-family: inherit; font-size: 13px; }
  button { cursor: pointer; }

  /* Shell Layout */
  #app { display: flex; min-height: 100vh; }
  
  /* Sidebar */
  #sidebar {
    width: 240px;
    background: linear-gradient(180deg, var(--navy), var(--navy2));
    color: #fff;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    z-index: 60;
    transition: left .25s ease;
  }
  #sidebar .brand {
    padding: 18px 18px 14px;
    border-bottom: 1px solid rgba(255, 255, 255, .12);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #sidebar .brand-mark {
    width: 38px;
    height: 38px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), #d98a12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 16px;
    color: var(--navy);
    flex-shrink: 0;
  }
  #sidebar .brand .name { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .2px; }
  #sidebar .brand .tag { font-size: 10.5px; color: var(--accent2); margin-top: 1px; letter-spacing: .3px; text-transform: uppercase; }
  
  #sidebar .quick-new { padding: 12px 14px 4px; }
  #sidebar .quick-new button {
    width: 100%;
    border: none;
    background: var(--accent);
    color: var(--navy);
    font-family: var(--font-display);
    font-weight: 700;
    padding: 10px 12px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: .15s;
  }
  #sidebar .quick-new button:hover { background: var(--accent2); }

  #sidebar nav { flex: 1; overflow-y: auto; padding: 10px 0; }
  #sidebar nav .navitem {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9.5px 18px;
    font-size: 13px;
    cursor: pointer;
    color: #cfd9e8;
    border-left: 3px solid transparent;
    transition: .12s;
  }
  #sidebar nav .navitem:hover { background: rgba(255, 255, 255, .06); color: #fff; }
  #sidebar nav .navitem.active {
    background: rgba(255, 255, 255, .12);
    color: #fff;
    border-left-color: var(--accent);
    font-weight: 600;
  }
  #sidebar nav .navitem .badge-count {
    margin-left: auto;
    background: rgba(245, 166, 35, .25);
    color: var(--accent2);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
  }

  #sidebar .foot {
    padding: 14px 18px;
    font-size: 11px;
    color: #93a2b8;
    border-top: 1px solid rgba(255, 255, 255, .12);
  }
  #sidebar select#roleSelect {
    width: 100%;
    margin-top: 6px;
    padding: 5px 8px;
    border-radius: 6px;
    border: none;
    background: rgba(255, 255, 255, .15);
    color: #fff;
    font-size: 11.5px;
    outline: none;
  }
  #sidebar select#roleSelect option { background: var(--navy); color: #fff; }

  /* Main Content Area */
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  
  header.topbar {
    background: #fff;
    border-bottom: 1px solid var(--line);
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  header.topbar h1 { font-family: var(--font-display); font-size: 18px; color: var(--navy); margin: 0; }
  header.topbar .sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }

  .topbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .user-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg);
    padding: 5px 10px;
    border-radius: 20px;
    border: 1px solid var(--line);
    font-size: 12px;
    font-weight: 600;
  }

  #content { padding: 22px 24px 60px; flex: 1; overflow-y: auto; }

  /* Panels, Cards & Grids */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .kpi {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: 0 1px 3px rgba(0,0,0,.02);
  }
  .kpi .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
  .kpi .value { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--navy); margin-top: 6px; }
  .kpi .value.red { color: var(--red); }
  .kpi .value.green { color: var(--green); }
  .kpi .value.amber { color: var(--amber); }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 1px 3px rgba(0,0,0,.02);
  }
  .panel h2 { font-family: var(--font-display); font-size: 15px; margin: 0 0 14px; color: var(--navy); }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .row > .panel { flex: 1; min-width: 300px; }

  /* Tables */
  .tbl-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--line); -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left;
    background: #f8fafc;
    color: var(--muted);
    font-weight: 600;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .4px;
  }
  td { padding: 10px 12px; border-bottom: 1px solid #eef1f6; vertical-align: middle; }
  tr:hover td { background: #fafcff; }
  .mono { font-family: var(--font-mono); font-size: 12px; }

  /* Buttons */
  button, .btn {
    border: none;
    border-radius: 7px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    transition: .15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary { background: var(--navy); color: #fff; }
  .btn-primary:hover { background: var(--navy2); }
  .btn-accent { background: var(--accent); color: var(--navy); }
  .btn-accent:hover { background: var(--accent2); }
  .btn-ghost { background: #eef1f6; color: var(--text); border: 1px solid var(--line); }
  .btn-ghost:hover { background: #e2e7ee; }
  .btn-danger { background: var(--red-dim); color: var(--red); }
  .btn-danger:hover { background: #f8d7d7; }
  .btn-success { background: var(--green-dim); color: var(--green); }
  .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 6px; }

  .toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 16px;
    justify-content: space-between;
  }
  .toolbar .left { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  /* Form Elements & Inputs - FIXED OVERFLOW & RELIABLE RESPONSIVENESS */
  input, select, textarea {
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    display: block;
    padding: 8.5px 11px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: #fff;
    color: var(--text);
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }
  label {
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
    display: block;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: .3px;
  }
  .field {
    margin-bottom: 12px;
    width: 100%;
    min-width: 0; /* CRITICAL FIX: prevents CSS grid child elements from expanding and overlapping */
    box-sizing: border-box;
  }
  .field-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    width: 100%;
    box-sizing: border-box;
  }

  /* Responsive Grid Columns */
  @media (min-width: 768px) {
    .field-grid {
      grid-template-columns: repeat(2, 1fr);
    }
    .field-grid.col-4 {
      grid-template-columns: repeat(4, 1fr);
    }
  }
  @media (max-width: 600px) {
    .field-grid, .field-grid.col-4 {
      grid-template-columns: 1fr !important;
    }
  }

  /* Badges */
  .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: .2px; }
  .badge-green { background: var(--green-dim); color: var(--green); }
  .badge-red { background: var(--red-dim); color: var(--red); }
  .badge-amber { background: var(--amber-dim); color: var(--amber); }
  .badge-gray { background: #eef1f6; color: var(--muted); }
  .badge-navy { background: #e7ecf5; color: var(--navy); }

  /* Modal Layout */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 35, 64, .55);
    backdrop-filter: blur(2px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 14px;
    overflow-y: auto;
    z-index: 1000;
  }
  .modal {
    background: #fff;
    border-radius: 12px;
    max-width: 740px;
    width: 100%;
    padding: 24px;
    margin: auto;
    box-shadow: 0 15px 35px rgba(0,0,0,.2);
    box-sizing: border-box;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
  }
  .modal h3 { margin: 0 0 16px; color: var(--navy); font-family: var(--font-display); font-size: 17px; }
  .modal .close-x { float: right; cursor: pointer; color: var(--muted); font-size: 24px; line-height: 1; margin-top: -4px; }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    flex-wrap: wrap;
  }

  /* Toast Notifications */
  #toastWrap { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: var(--navy);
    color: #fff;
    padding: 11px 16px;
    border-radius: 8px;
    font-size: 13px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .2);
    animation: slidein .2s ease;
  }
  .toast.error { background: var(--red); }
  .toast.success { background: var(--green); }
  @keyframes slidein { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty-state .big { font-size: 36px; margin-bottom: 8px; }

  /* App Switcher - single unified Goodwin ERP + Ledger Pro application */
  .app-switcher {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,.12);
  }
  .app-switcher-label {
    font-size: 10px; color: #93a2b8; text-transform: uppercase;
    letter-spacing: .6px; margin-bottom: 7px; font-weight: 700;
  }
  .app-switcher-box {
    display: grid; grid-template-columns: 1fr 1fr; gap: 5px;
    background: rgba(255,255,255,.07); padding: 4px; border-radius: 9px;
  }
  .app-switcher-btn {
    border: 1px solid transparent; background: transparent; color: #cfd9e8;
    padding: 7px 6px; border-radius: 6px; font-size: 11px; font-weight: 700;
    justify-content: center; white-space: nowrap;
  }
  .app-switcher-btn:hover { background: rgba(255,255,255,.08); color: #fff; }
  .app-switcher-btn.active {
    background: var(--accent); color: var(--navy); border-color: rgba(255,255,255,.1);
  }
  .mode-pill {
    display:inline-flex; align-items:center; gap:5px; font-size:10px;
    padding:3px 7px; border-radius:10px; background:var(--accent-dim); color:var(--navy);
    font-weight:700; margin-left:7px; vertical-align:middle;
  }
  /* Mobile Responsive Breakpoints */
  @media (max-width: 780px) {
    #sidebar {
      position: fixed;
      left: -240px;
      top: 0;
      bottom: 0;
      z-index: 2000;
      box-shadow: 4px 0 20px rgba(0,0,0,.25);
    }
    #sidebar.open { left: 0; }
    .mobile-menu-btn { display: inline-flex !important; }
    #content { padding: 16px 14px 40px; }
    header.topbar { padding: 10px 14px; }
    .topbar-actions { gap: 6px; }
    .topbar-actions button { font-size: 11.5px; padding: 5px 8px; }
  }
  @media (min-width: 781px) {
    .mobile-menu-btn { display: none !important; }
  }
  @media (max-width: 600px) {
    .modal-backdrop { padding: 10px 8px; }
    .modal { padding: 18px 14px; max-height: 94vh; }
    .modal-actions { flex-direction: column-reverse; }
    .modal-actions button { width: 100%; justify-content: center; }
  }

  @media print {
    #sidebar, header.topbar, .toolbar, .no-print { display: none !important; }
    #content { padding: 0; }
    body { background: #fff; }
  }
</style>
</head>
<body>

<div id="app">
  <!-- SIDEBAR NAVIGATION -->
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark">GB</div>
      <div>
        <div class="name">⚡ GOODWIN ERP</div>
        <div class="tag">Ledger & Inventory Pro</div>
      </div>
    </div>
    
    <div class="quick-new">
      <button onclick="app.openNewInvoiceModal()">⚡ + New Invoice / Order</button>
    </div>

    <nav id="navList"></nav>

    <div class="foot">
      <div>Role Mode:</div>
      <select id="roleSelect"></select>
      <div class="app-switcher">
        <div class="app-switcher-label">Application</div>
        <div class="app-switcher-box">
          <button id="modeGoodwin" class="app-switcher-btn" onclick="app.switchMode('goodwin')">⚡ Goodwin ERP</button>
          <button id="modeLedger" class="app-switcher-btn" onclick="app.switchMode('ledger')">📒 Ledger Pro</button>
        </div>
      </div>
      <div style="margin-top:10px;">
        Persistence: <b id="storageModeLabel">—</b>
        <div style="font-size:10.5px;color:#93a2b8;margin-top:2px;" id="dataModeNote"></div>
      </div>
      <button class="btn-ghost btn-sm" style="width:100%;margin-top:10px;background:rgba(255,255,255,.1);color:#fff;border:none;" onclick="app.openSupabaseModal()">⚡ Supabase Cloud / DB</button>
    </div>
  </aside>

  <!-- MAIN AREA -->
  <div id="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="btn-ghost btn-sm mobile-menu-btn" onclick="app.toggleSidebar()">☰ Menu</button>
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <div class="sub" id="pageSub">Overview of sales, inventory & ledger</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="supabaseHeaderBtn" class="btn-ghost btn-sm" onclick="app.openSupabaseModal()">
          <span id="supaStatusDot">⚡</span> <span id="supaHeaderLabel">Supabase DB</span>
        </button>
        <div id="authUserBadge" class="user-badge" style="display:none;"></div>
        <button class="btn-ghost btn-sm" onclick="app.openAuthModal()" id="authBtn">👤 Sign In</button>
        <button class="btn-ghost btn-sm" onclick="app.exportBackup()">⇩ Backup JSON</button>
      </div>
    </header>

    <div id="content"></div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastWrap"></div>

<script>
/* =========================================================================
   GOODWIN BATTERIES — ENTERPRISE ERP & LEDGER PRO (SUPABASE CONNECTED)
   ========================================================================= */

/* -------------------------- SUPABASE & STORAGE ADAPTER ----------------------- */
// Shared cloud layer for BOTH Goodwin ERP and Ledger Pro workspaces.
// Both modes read/write the same erp_store table and therefore see the same live records.

const SupabaseStore = (() => {
  let client = null;
  let config = {
    url: localStorage.getItem('gw_supabase_url') || '',
    key: localStorage.getItem('gw_supabase_key') || '',
    tableName: 'erp_store'
  };

  function init() {
    if (config.url && config.key && typeof window.supabase !== 'undefined') {
      try {
        client = window.supabase.createClient(config.url, config.key);
        return true;
      } catch (e) {
        console.error('Supabase init failed:', e);
        client = null;
        return false;
      }
    }
    client = null;
    return false;
  }

  function isConfigured() { return !!(config.url && config.key); }
  function isConnected() { return !!client; }

  function saveConfig(url, key) {
    config.url = (url || '').trim();
    config.key = (key || '').trim();
    localStorage.setItem('gw_supabase_url', config.url);
    localStorage.setItem('gw_supabase_key', config.key);
    return init();
  }

  function disconnect() {
    config.url = '';
    config.key = '';
    localStorage.removeItem('gw_supabase_url');
    localStorage.removeItem('gw_supabase_key');
    client = null;
  }

  async function testConnection() {
    if (!config.url || !config.key) return { success: false, error: 'Please enter both Supabase Project URL and Anon Key.' };
    if (typeof window.supabase === 'undefined') return { success: false, error: 'Supabase JS SDK library not loaded. Check internet connection.' };
    try {
      const tempClient = window.supabase.createClient(config.url, config.key);
      const { data, error } = await tempClient.from(config.tableName).select('key').limit(1);
      if (error) {
        if (error.code === '42P01' || (error.message && error.message.includes('does not exist'))) {
          return { success: false, needTable: true, error: 'Connected to Supabase project, but "erp_store" table was not found. Copy and run the SQL setup script below!' };
        }
        return { success: false, error: `Supabase Error (${error.code || 'DB'}): ${error.message}` };
      }
      client = tempClient;
      return { success: true, message: 'Successfully connected to your Supabase PostgreSQL database!' };
    } catch (e) {
      return { success: false, error: e.message || 'Network error connecting to Supabase' };
    }
  }

  async function get(key) {
    if (!client) return null;
    try {
      const { data, error } = await client.from(config.tableName).select('value').eq('key', key).maybeSingle();
      if (error || !data) return null;
      return typeof data.value === 'string' ? JSON.parse(data.value) : data.value;
    } catch (e) { return null; }
  }

  async function set(key, value) {
    if (!client) return false;
    try {
      const payload = { key: key, value: value, updated_at: new Date().toISOString() };
      const { error } = await client.from(config.tableName).upsert(payload, { onConflict: 'key' });
      return !error;
    } catch (e) { return false; }
  }

  async function pushAll() {
    if (!client) return { success: false, error: 'Supabase client not connected' };
    try {
      for (const c of COLLECTIONS) await set('gw:' + c, DB[c]);
      await set('gw:counters', COUNTERS);
      await set('gw:settings', SETTINGS);
      await set('gw:seeded', true);
      return { success: true };
    } catch (e) { return { success: false, error: e.message }; }
  }

  async function pullAll() {
    if (!client) return { success: false, error: 'Supabase client not connected' };
    try {
      for (const c of COLLECTIONS) {
        const val = await get('gw:' + c);
        if (val) DB[c] = val;
      }
      const cnt = await get('gw:counters');
      if (cnt) COUNTERS = cnt;
      const st = await get('gw:settings');
      if (st) SETTINGS = st;
      return { success: true };
    } catch (e) { return { success: false, error: e.message }; }
  }

  init();
  return {
    init, isConfigured, isConnected, saveConfig, disconnect, testConnection,
    get, set, pushAll, pullAll, getConfig: () => ({ ...config }), getClient: () => client
  };
})();

/* Storage Layer Router */
const Store = (() => {
  let memory = {};
  const hasRealStorage = () => (typeof window !== 'undefined' && !!window.storage);

  async function get(key) {
    if (SupabaseStore.isConnected()) {
      const val = await SupabaseStore.get(key);
      if (val !== null) return val;
    }
    if (hasRealStorage()) {
      try {
        const res = await window.storage.get(key, false);
        if (res && res.value) return JSON.parse(res.value);
      } catch (e) {}
    }
    try {
      const ls = localStorage.getItem(key);
      if (ls) return JSON.parse(ls);
    } catch(e) {}
    return memory[key] !== undefined ? JSON.parse(JSON.stringify(memory[key])) : null;
  }

  async function set(key, value) {
    let saved = false;
    if (SupabaseStore.isConnected()) {
      if (await SupabaseStore.set(key, value)) saved = true;
    }
    if (hasRealStorage()) {
      try { await window.storage.set(key, JSON.stringify(value), false); saved = true; } catch (e) {}
    }
    try { localStorage.setItem(key, JSON.stringify(value)); saved = true; } catch(e) {}
    memory[key] = JSON.parse(JSON.stringify(value));
    return saved;
  }

  function getModeLabel() {
    if (SupabaseStore.isConnected()) return '🟢 Supabase Cloud (PostgreSQL)';
    if (hasRealStorage()) return '🔵 window.storage (Local)';
    return '🟠 Browser LocalStorage';
  }
  function getModeDescription() {
    if (SupabaseStore.isConnected()) return 'Connected to Supabase Cloud Database. Records sync in real-time.';
    if (hasRealStorage()) return 'Saved to sandboxed window.storage.';
    return 'Saved to browser LocalStorage.';
  }

  return { get, set, usingRealStorage: () => SupabaseStore.isConnected() || hasRealStorage(), getModeLabel, getModeDescription };
})();

function uid(prefix) { return prefix + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }
function todayISO() { return new Date().toISOString().slice(0,10); }
function nowISO() { return new Date().toISOString(); }
function inr(n) {
  n = Number(n) || 0;
  const neg = n < 0; n = Math.abs(n);
  let s = n.toFixed(2);
  let [int, dec] = s.split('.');
  let last3 = int.slice(-3), rest = int.slice(0, -3);
  if (rest !== '') last3 = ',' + last3;
  let formatted = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + last3;
  return (neg ? '-' : '') + '₹' + formatted + '.' + dec;
}
function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function esc(s){ return String(s===undefined||s===null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function nextNumber(seriesKey, prefix) {
  const year = new Date().getFullYear();
  const ck = `${seriesKey}-${year}`;
  COUNTERS[ck] = (COUNTERS[ck] || 0) + 1;
  const n = String(COUNTERS[ck]).padStart(4, '0');
  return `${prefix}-${year}-${n}`;
}

/* ============================ ACCOUNTING ENGINE ========================== */
function calcLine(qty, rate, discountPct, gstRate, sameState) {
  qty = num(qty); rate = num(rate); discountPct = num(discountPct); gstRate = num(gstRate);
  const gross = qty * rate;
  const discount = gross * discountPct / 100;
  const taxable = gross - discount;
  let cgst = 0, sgst = 0, igst = 0;
  if (sameState) { cgst = taxable * gstRate / 200; sgst = taxable * gstRate / 200; }
  else { igst = taxable * gstRate / 100; }
  const total = taxable + cgst + sgst + igst;
  return { gross, discount, taxable, cgst, sgst, igst, total };
}

function invoiceTotals(lines, freight, sameState) {
  let taxable=0, cgst=0, sgst=0, igst=0;
  const computed = lines.map(l => {
    const c = calcLine(l.qty, l.rate, l.discountPct, l.gstRate, sameState);
    taxable += c.taxable; cgst += c.cgst; sgst += c.sgst; igst += c.igst;
    return { ...l, ...c };
  });
  const grandTotal = taxable + cgst + sgst + igst + num(freight);
  return { lines: computed, taxable, cgst, sgst, igst, freight: num(freight), grandTotal };
}

function invoiceAllocatedAmount(invoiceId) {
  let sum = 0;
  DB.receipts.forEach(r => (r.allocations||[]).forEach(a => { if (a.invoiceId === invoiceId) sum += num(a.amount); }));
  return sum;
}
function invoiceCreditNoteAmount(invoiceId) {
  let sum = 0;
  DB.salesReturns.forEach(sr => { if (sr.invoiceId === invoiceId && sr.status !== 'Cancelled') sum += num(sr.creditNoteAmount); });
  return sum;
}
function invoiceOutstanding(inv) {
  if (inv.status === 'Cancelled' || inv.status === 'Draft') return 0;
  const allocated = invoiceAllocatedAmount(inv.id);
  const cn = invoiceCreditNoteAmount(inv.id);
  return round2(inv.grandTotal - allocated - cn);
}
function round2(n){ return Math.round((num(n)+Number.EPSILON)*100)/100; }

function customerUnallocatedCredit(customerId) {
  let sum = 0;
  DB.receipts.filter(r => r.customerId === customerId).forEach(r => {
    const allocated = (r.allocations||[]).reduce((s,a)=>s+num(a.amount),0);
    sum += Math.max(0, num(r.amount) - allocated);
  });
  return round2(sum);
}
function customerOutstanding(customerId) {
  const invs = DB.salesInvoices.filter(i => i.customerId === customerId && i.status !== 'Cancelled' && i.status !== 'Draft');
  const total = invs.reduce((s,i)=> s + invoiceOutstanding(i), 0);
  return round2(total - customerUnallocatedCredit(customerId));
}
function supplierOutstanding(supplierId) {
  const purs = DB.purchaseInvoices.filter(p => p.supplierId === supplierId && p.status !== 'Cancelled' && p.status !== 'Draft');
  const total = purs.reduce((s,p)=> s + purchaseOutstanding(p), 0);
  return round2(total - supplierUnallocatedCredit(supplierId));
}
function purchaseAllocatedAmount(purchaseId) {
  let sum = 0;
  DB.payments.forEach(p => (p.allocations||[]).forEach(a => { if (a.purchaseId === purchaseId) sum += num(a.amount); }));
  return sum;
}
function purchaseOutstanding(p) {
  if (p.status === 'Cancelled' || p.status === 'Draft') return 0;
  return round2(p.grandTotal - purchaseAllocatedAmount(p.id));
}

function stock(productId) {
  return round2((DB.stockTx||[]).filter(t => t.productId === productId).reduce((s, t) => s + num(t.qty), 0));
}
function recordStockTx(productId, delta, type, refType, refId, note) {
  const before = stock(productId);
  const after = round2(before + delta);
  DB.stockTx.push({
    id: uid('STX'), date: todayISO(), productId, type, qty: delta, before, after,
    refType, refId, note: note || '', user: CURRENT_ROLE
  });
  persist('stockTx');
  return after;
}

function createSalesInvoiceObj({customerId, date, dueDate, paymentMode, status, lines, freight, notes, docType}) {
  const cust = DB.customers.find(c => c.id === customerId);
  const sameState = cust && cust.state === SETTINGS.companyState;
  const enriched = lines.map(l => {
    const p = DB.products.find(pp => pp.id === l.productId);
    return { productId: l.productId, sku: p?p.sku:'', name: p?p.name:l.name, hsn: p?p.hsn:'', qty: num(l.qty), rate: num(l.rate), discountPct: num(l.discountPct||0), gstRate: p?p.gstRate:18 };
  });
  const totals = invoiceTotals(enriched, freight||0, sameState);
  const prefix = docType === 'Quotation' ? 'GW-QT' : docType === 'Proforma Invoice' ? 'GW-PI' : 'GW-INV';
  return {
    id: uid('INV'), number: nextNumber(docType||'SALES', prefix), date, dueDate, customerId, paymentMode: paymentMode||'Credit',
    status: status||'Confirmed', docType: docType||'GST Tax Invoice', sameState, lines: totals.lines, taxable: round2(totals.taxable),
    cgst: round2(totals.cgst), sgst: round2(totals.sgst), igst: round2(totals.igst), freight: round2(totals.freight), grandTotal: round2(totals.grandTotal),
    notes: notes||'', createdAt: nowISO(), createdBy: CURRENT_ROLE
  };
}
function applyStockForSale(inv) {
  if (inv.docType === 'Quotation' || inv.docType === 'Proforma Invoice') return;
  inv.lines.forEach(l => recordStockTx(l.productId, -Math.abs(l.qty), 'Sale', 'Sale', inv.id, inv.number));
}

  const collToday = DB.receipts.filter(r => r.date === today).reduce((s, r) => s + num(r.amount), 0);
  const monthPrefix = today.slice(0, 7);
  const monthSales = DB.salesInvoices.filter(i => i.date.startsWith(monthPrefix) && i.status !== 'Cancelled' && i.status !== 'Draft').reduce((s, i) => s + i.grandTotal, 0);

app.saveInvoice = async () => {
  const custId = document.getElementById('mi_cust').value;
  const docType = document.getElementById('mi_type').value;
  const date = document.getElementById('mi_date').value;
  const freight = num(document.getElementById('mi_freight').value);
  
  const lineRows = document.querySelectorAll('#mi_lines tr');
  const lines = [];
  lineRows.forEach(tr => {
    const productId = tr.querySelector('.mi_prod').value;
    const qty = num(tr.querySelector('.mi_qty').value);
    const rate = num(tr.querySelector('.mi_rate').value);
    const discountPct = num(tr.querySelector('.mi_disc').value);
    if (qty > 0) lines.push({ productId, qty, rate, discountPct });
  });

  if (!lines.length) { toast('Please add at least one line item','error'); return; }

  const cust = DB.customers.find(c => c.id === custId);

app.viewPartyLedger = (partyId) => {
  currentPage = 'partyledger';
  renderNav();
  route();
  setTimeout(() => {
    const sel = document.getElementById('pl_party_select');
    if (sel) {
      const match = Array.from(sel.options).find(o => o.value.includes(partyId));
      if (match) { sel.value = match.value; app.loadPartyLedgerTable(); }
    }
  }, 100);

app.loadPartyLedgerTable = () => {
  const val = document.getElementById('pl_party_select') ? document.getElementById('pl_party_select').value : '';
  const box = document.getElementById('partyLedgerBox');
  if (!val || !box) return;

  const isCust = val.startsWith('CUS_');
  const partyId = val.replace('CUS_','').replace('SUP_','');
  const party = isCust ? DB.customers.find(c=>c.id===partyId) : DB.suppliers.find(s=>s.id===partyId);

  const entries = [];
  if (isCust) {
    DB.salesInvoices.filter(i=>i.customerId===partyId && i.status!=='Cancelled').forEach(i => entries.push({ date:i.date, type:'Sales Invoice', ref:i.number, debit:i.grandTotal, credit:0 }));
    DB.receipts.filter(r=>r.customerId===partyId).forEach(r => entries.push({ date:r.date, type:'Receipt / Payment In', ref:r.number, debit:0, credit:r.amount }));
  } else {
    DB.purchaseInvoices.filter(p=>p.supplierId===partyId && p.status!=='Cancelled').forEach(p => entries.push({ date:p.date, type:'Purchase Invoice', ref:p.number, debit:0, credit:p.grandTotal }));
    DB.payments.filter(p=>p.supplierId===partyId).forEach(p => entries.push({ date:p.date, type:'Payment Out', ref:p.number, debit:p.amount, credit:0 }));
  }

  entries.sort((a,b) => a.date.localeCompare(b.date));

  let running = 0;
  box.innerHTML = `
    <div style="display:flex;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;">
      <div>
        <h3>${esc(party?party.name:'')}</h3>
        <div style="color:var(--muted);font-size:12px;">${esc(party?party.address:'')} | GSTIN: ${esc(party?party.gstin:'')}</div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:11px;color:var(--muted);">Current Balance</div>
        <div style="font-size:20px;font-weight:700;color:var(--navy);">${inr(isCust ? customerOutstanding(partyId) : supplierOutstanding(partyId))}</div>
      </div>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Date</th><th>Type</th><th>Reference #</th><th>Debit (Dr)</th><th>Credit (Cr)</th><th>Running Balance</th></tr></thead>
        <tbody>
          ${entries.map(e => {
            running += (e.debit - e.credit);
            return `
              <tr>
                <td>${e.date}</td>
                <td><span class="badge badge-navy">${e.type}</span></td>
                <td class="mono">${esc(e.ref)}</td>
                <td>${e.debit ? inr(e.debit) : '-'}</td>
                <td>${e.credit ? inr(e.credit) : '-'}</td>
                <td><b>${inr(running)}</b></td>
              </tr>
            `;
          }).join('') || '<tr><td colspan="6" class="empty-state">No transaction ledger history.</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
};

          <thead><tr><th>Serial #</th><th>Product</th><th>Customer</th><th>Sale Date</th><th>Warranty Expiry</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>
            ${DB.warranties.map(w => {
              const p = DB.products.find(x=>x.id===w.productId);
              const c = DB.customers.find(x=>x.id===w.customerId);
              return `
                <tr>
                  <td><b class="mono">${esc(w.serial||'SER-REG')}</b></td>
                  <td><b>${p?esc(p.name):'-'}</b></td>
                  <td>${c?esc(c.name):'-'}</td>
                  <td>${w.saleDate}</td>
                  <td>${w.expiryDate}</td>
                  <td><span class="badge badge-green">${w.status}</span></td>
                  <td><button class="btn-ghost btn-sm" onclick="app.replaceWarranty('${w.id}')">Issue Replacement</button></td>
                </tr>
              `;
            }).join('') || '<tr><td colspan="7" class="empty-state">No batteries registered for warranty yet.</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  `;
}
app.openWarrantyRegModal = () => {
  const prodOptions = DB.products.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
  const custOptions = DB.customers.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  const html = `
    <span class="close-x" onclick="closeModal()">&times;</span>
    <h3>Register Battery Warranty</h3>
    <div class="field-grid">
      <div class="field"><label>Battery Serial Number *</label><input id="mw_ser" value="GB-2026-9901"></div>
      <div class="field"><label>Product *</label><select id="mw_prod">${prodOptions}</select></div>
      <div class="field"><label>Customer *</label><select id="mw_cust">${custOptions}</select></div>
      <div class="field"><label>Sale Date</label><input id="mw_date" type="date" value="${todayISO()}"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="app.saveWarranty()">Register Serial</button>
    </div>
  `;
  openModal(html);
};
app.saveWarranty = async () => {
  const serial = document.getElementById('mw_ser').value.trim();
  const productId = document.getElementById('mw_prod').value;
  const customerId = document.getElementById('mw_cust').value;
  const saleDate = document.getElementById('mw_date').value;

  const p = DB.products.find(x=>x.id===productId);
  const warrantyMonths = p ? p.warrantyMonths : 18;

  DB.warranties.push({
    id: uid('WAR'), serial, productId, customerId, saleDate, warrantyMonths,
    expiryDate: addDays(saleDate, warrantyMonths*30), status: 'Active'
  });
  await persist('warranties');
  toast('Warranty registered!','success');
  closeModal();
  route();
};
app.replaceWarranty = async (id) => {
  const w = DB.warranties.find(x => x.id === id);
  if (!w) return;
  if (!confirm('Mark battery as replaced under warranty? This issues a replacement unit from stock without double-counting sales revenue.')) return;
  w.status = 'Replaced';
  recordStockTx(w.productId, -1, 'Warranty Replacement', 'Warranty', w.id, 'Replacement issued');
  await persist('warranties');
  toast('Replacement unit issued & stock reduced by 1','success');
  route();
};

  key text primary key,
  value jsonb not null,
  updated_at timestamp with time zone default timezone('utc'::text, now())
);

alter table public.erp_store enable row level security;

drop policy if exists "Public Access ERP Store" on public.erp_store;
create policy "Public Access ERP Store" on public.erp_store for all using (true) with check (true);`;

  const html = `
    <span class="close-x" onclick="closeModal()">&times;</span>
    <h3 style="display:flex;align-items:center;gap:8px;">⚡ Supabase Cloud Database Integration</h3>

      <div class="field">

        <span style="font-size:11px;color:var(--muted);">Found in Supabase Dashboard ➔ Project Settings ➔ API</span>
      </div>
      <div class="field">
        <label>Supabase Anon / Public Key *</label>
        <input id="supa_key_input" type="password" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." value="${esc(cfg.key)}">

        <button class="btn-ghost" onclick="app.pushToSupabase()">⬆️ Push Local Data to Supabase</button>

app.copySql = (id) => {
  const text = document.getElementById(id).value;
  navigator.clipboard.writeText(text).then(() => toast('SQL script copied to clipboard!','success')).catch(() => toast('Copy failed','error'));
};

app.saveAndTestSupabase = async () => {
  const url = document.getElementById('supa_url_input').value.trim();
  const key = document.getElementById('supa_key_input').value.trim();
  const fb = document.getElementById('supaTestFeedback');

  if (!url || !key) {
    fb.innerHTML = `<div style="background:#fdecec;color:var(--red);padding:10px;border-radius:6px;font-size:12.5px;">Please enter both Project URL and Anon Key.</div>`;
    return;
  }

  SupabaseStore.saveConfig(url, key);
  fb.innerHTML = `<div style="background:#eef1f6;color:var(--text);padding:10px;border-radius:6px;font-size:12.5px;">Testing connection to Supabase...</div>`;

  const res = await SupabaseStore.testConnection();
  if (res.success) {
    fb.innerHTML = `<div style="background:#e5f5ec;color:var(--green);padding:10px;border-radius:6px;font-size:12.5px;font-weight:600;">✅ ${res.message}</div>`;
    toast('Supabase connected successfully!','success');
    renderSidebar();
    const supaCust = await SupabaseStore.get('gw:customers');
    if (!supaCust) {
      await SupabaseStore.pushAll();
      toast('Initial ERP data pushed to Supabase Cloud!','success');
    }
  } else {
    fb.innerHTML = `<div style="background:#fdecec;color:var(--red);padding:10px;border-radius:6px;font-size:12.5px;"><strong>⚠️ Connection Failed:</strong><br>${esc(res.error)}</div>`;
    renderSidebar();
  }
};

app.disconnectSupabase = () => {
  if (confirm('Disconnect from Supabase? Your local data will remain saved in browser.')) {
    SupabaseStore.disconnect();
    toast('Disconnected from Supabase','success');
    renderSidebar();
    closeModal();
    if (currentPage === 'settings') route();
  }
};
app.pushToSupabase = async () => {
  toast('Pushing local records to Supabase Cloud...','');
  const res = await SupabaseStore.pushAll();
  if (res.success) toast('Successfully uploaded all records to Supabase!','success');
  else toast(`Push failed: ${res.error}`,'error');
};
app.pullFromSupabase = async () => {
  if (confirm('Pull data from Supabase Cloud into local browser state?')) {
    toast('Pulling records from Supabase...','');
    const res = await SupabaseStore.pullAll();
    if (res.success) { toast('Data downloaded from Supabase!','success'); route(); closeModal(); }
    else toast(`Pull failed: ${res.error}`,'error');
  }
};

/* Supabase Auth Modal */
app.openAuthModal = () => {
  const html = `
    <span class="close-x" onclick="closeModal()">&times;</span>
    <h3>👤 Supabase Authentication</h3>
    <p class="muted" style="font-size:12px;margin-bottom:14px;">Sign in with your Supabase credentials to identify your user session.</p>
    <div class="field-grid" style="grid-template-columns:1fr;">
      <div class="field"><label>Email Address</label><input id="auth_email" type="email" placeholder="admin@goodwinbatteries.com"></div>
      <div class="field"><label>Password</label><input id="auth_pass" type="password"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="app.doAuthLogin()">Sign In</button>
    </div>
  `;
  openModal(html);
};
app.doAuthLogin = async () => {
  const email = document.getElementById('auth_email').value.trim();
  const pass = document.getElementById('auth_pass').value.trim();
  if (!email || !pass) { toast('Please enter email and password','error'); return; }

  if (SupabaseStore.isConnected()) {
    try {
      const client = SupabaseStore.getClient();
      const { data, error } = await client.auth.signInWithPassword({ email, password: pass });
      if (error) { toast(`Auth error: ${error.message}`,'error'); return; }
      CURRENT_USER = data.user;
      toast(`Welcome back ${email}!`,'success');
      updateAuthUI();
      closeModal();
    } catch(e) { toast(e.message,'error'); }
  } else {
    CURRENT_USER = { email };
    toast(`Logged in locally as ${email}`,'success');
    updateAuthUI();
    closeModal();
  }
};
function updateAuthUI() {
  const btn = document.getElementById('authBtn');
  const badge = document.getElementById('authUserBadge');
  if (CURRENT_USER) {
    if (btn) btn.style.display = 'none';
    if (badge) {
      badge.style.display = 'flex';
      badge.innerHTML = `👤 ${esc(CURRENT_USER.email)} <a onclick="app.doLogout()" style="color:var(--red);cursor:pointer;margin-left:6px;">Logout</a>`;
    }
  } else {
    if (btn) btn.style.display = 'inline-flex';
    if (badge) badge.style.display = 'none';
  }
}
app.doLogout = () => {
  if (SupabaseStore.isConnected()) {
    SupabaseStore.getClient().auth.signOut();
  }
  CURRENT_USER = null;
  updateAuthUI();
  toast('Signed out','success');
};

app.exportBackup = () => {
  const backup = { exportedAt: nowISO(), settings: SETTINGS, counters: COUNTERS, data: DB };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `goodwin-erp-backup-${todayISO()}.json`; a.click();
  toast('Backup downloaded','success');
};

/* =================================== BOOT ==================================== */
async function boot() {
  await loadAll();
  renderSidebar();
  route();
  updateAuthUI();
}
boot();
